        text: "Great design! You covered cold-start, engagement metrics, multimodal features, model architecture, training, serving, and ecosystem monitoring."
      - speaker: candidate
        text: "Thank you. The key insight for me is that TikTok's FYP is not just a recommendation system -- it's a marketplace between creators and viewers."
      - speaker: interviewer
        text: "Exactly. The creator ecosystem health is what separates a good recommendation system from a great one. Any final thoughts?"
      - speaker: candidate
        text: "I'd want to explore cross-market adaptation and responsible AI considerations more deeply, especially around content safety for younger users."
      - speaker: interviewer
        text: "Those are excellent follow-up areas. Well done!"
