    label: "Automated Monitoring Complete"
    speaker: interviewer
    content: |
      Excellent work! You've designed a comprehensive **text-to-image generation system** with scalable automated monitoring.

      **Your design summary:**
      - **Problem**: Production text-to-image system at massive scale with diverse quality requirements
      - **Architecture**: Generation approach selected with strong technical justification
      - **Metrics**: Balanced automated metrics (FID, CLIP, aesthetic score) with user behavior signals
