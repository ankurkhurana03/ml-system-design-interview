  - id: mod_question
    stage: model
    type: question
    label: "ML-Powered Analysis"
    speaker: interviewer
    content: |
      Beyond basic statistical testing, where should we apply ML to make the experimentation platform smarter? There are several opportunities — interference detection, automated metric sensitivity analysis, multi-armed bandits for optimization, and heterogeneous treatment effect estimation.

      Which ML capability would you prioritize building?
    dialogue:
      - speaker: interviewer
        text: "Where should we apply ML to make the platform smarter? Interference detection, bandits, heterogeneous effects — there are many opportunities."
      - speaker: candidate
        text: "Each addresses a different pain point. Interference detection prevents invalid conclusions. Bandits reduce the cost of experimentation. Heterogeneous effects reveal who benefits most. I need to choose based on impact."
      - speaker: interviewer
        text: "Which would you build first and why?"
    choices:
      - label: "Experiment interference detection"
        answer: |
          I would prioritize **automated experiment interference detection** — identifying when concurrent experiments interact with each other and invalidate results.

          **Why this matters most:**
          With 3,000 concurrent experiments, the probability of interference is not theoretical — it is guaranteed. Meta's research team found that 5-10% of experiments had statistically significant interactions with other concurrent experiments. An experiment that "works" in isolation might fail when combined with another change, or two experiments might amplify each other's effects.

          **Types of interference:**
          1. **Feature collision**: Two experiments change the same UI element or code path. Example: Experiment A changes the "Buy" button color, Experiment B changes the button text. Users in both experiments see a confusing hybrid.
          2. **Metric contamination**: Experiment A increases overall site traffic. Experiment B measures click-through rate. B's control group now has different baseline traffic, contaminating the measurement.
          3. **Resource competition**: Experiment A increases server load. Experiment B measures latency. B's treatment and control both get slower, masking B's actual latency impact.
          4. **Behavioral interference**: Experiment A changes the recommendation algorithm. Users discover different content, which changes their behavior in Experiment B's feed ranking test.

          **Detection model:**
          - **Interaction regression**: For each pair of concurrent experiments (A, B) sharing users, fit: `Y = beta_A * A + beta_B * B + beta_AB * A*B + covariates + error`
          - If the interaction term beta_AB is statistically significant (p < 0.01), experiments A and B interact.
          - With 3,000 experiments, there are ~4.5 million pairs — infeasible to test all. **Prioritize pairs** based on: (a) overlapping user populations > 10%, (b) modifying related features (same service, same page), (c) affecting correlated metrics.
          - Use a ML classifier to predict which experiment pairs are likely to interact, trained on historical interaction data. Features: code overlap (do they modify the same files?), metric overlap, user overlap, and semantic similarity of experiment descriptions.

          **Automated response:**
          - When interaction detected: alert both experiment owners with the estimated interaction magnitude
          - Recommend: run one experiment at a time in the conflicting population segment, or use a factorial design to explicitly measure the interaction
          - Dashboard flag: "This experiment's results may be affected by interaction with Experiment X. Estimated bias: +/- Y%."

          **Interaction-aware analysis (advanced):**
          - For experiments with known interactions, adjust the treatment effect estimate by subtracting the estimated interaction effect
          - Use a Bayesian hierarchical model that jointly estimates treatment effects for interacting experiments
          - This is computationally expensive but necessary for high-stakes experiments (revenue-impacting changes)
        next: train_strategy
      - label: "Multi-armed bandits for adaptive experiments"
        answer: |
          I would prioritize **multi-armed bandits (MAB)** for adaptive experimentation — dynamically allocating traffic to better-performing variants during the experiment.

          **Why bandits matter most:**
          Traditional A/B tests waste traffic on clearly inferior variants. If variant B is obviously worse than A after the first day, a fixed-horizon test continues sending 50% of traffic to B for the remaining 2 weeks. Bandits solve this by shifting traffic toward winning variants as evidence accumulates, reducing the "regret" (opportunity cost of suboptimal assignments).

          **Where bandits are most valuable:**
          - **UI optimization**: Testing 5+ button colors, copy variations, or layout options. With 5 variants, a fixed test allocates only 20% to each — bandits can allocate 60%+ to the leader within days.
          - **Pricing experiments**: Testing price points where suboptimal prices directly cost revenue. Every hour spent at a bad price is lost money.
          - **Content recommendations**: Testing ranking algorithms where user engagement directly translates to retention.

          **Algorithm choice — Thompson Sampling:**
          - Maintain a Beta posterior for each variant's success probability: `Beta(alpha=successes+1, beta=failures+1)`
          - At each allocation decision, sample from each variant's posterior and assign traffic to the variant with the highest sample
          - Naturally balances exploration (uncertain variants get traffic) and exploitation (proven winners get more traffic)
          - Theoretical regret bound: O(sqrt(K * T * log(T))) where K = number of variants, T = number of users

          **Implementation architecture:**
          ```
          User Request
               |
               v
          Bandit Service (gRPC, <5ms)
           |- Pull current posterior parameters from Redis
           |- Sample from each variant's posterior
           |- Assign user to highest-sample variant
           |- Log assignment
               |
               v (async, every 5 minutes)
          Reward Aggregator (Flink)
           |- Compute per-variant reward from event stream
           |- Update posterior parameters in Redis
          ```

          **Statistical validity with bandits:**
          - Traditional p-values are invalid for bandit experiments (non-uniform allocation violates standard assumptions)
          - Use **inverse propensity weighted (IPW) estimators**: weight each observation by 1/p(assignment) to correct for non-uniform allocation
          - Or use the **doubly robust estimator** which combines IPW with a direct model for even lower variance
          - Netflix published that IPW-corrected bandit experiments produced unbiased treatment effect estimates while reducing regret by 30-50% vs fixed allocation

          **Contextual bandits (extension):**
          - Personalize variant assignment based on user features: `P(variant | user_features)`
          - Example: the best button color might differ by age group. Contextual bandits learn this automatically.
          - Use LinUCB or neural contextual bandits for high-dimensional feature spaces

          **Trade-off:** Bandits add significant infrastructure complexity (real-time assignment service, reward pipeline, IPW correction). They are only beneficial when (a) there are 3+ variants, (b) the reward signal is fast (within hours, not weeks), and (c) the opportunity cost of suboptimal assignment is high. For simple 2-variant experiments with long-term metrics, fixed allocation is simpler and more powerful.
        next: train_strategy

  # ======================================================================
  # STAGE 6: TRAINING (1 node)
  # train_strategy (CONVERGENCE) -> deploy_question
  # ======================================================================

  - id: train_strategy
    stage: training
    type: info
    label: "Training and Calibration"
    speaker: candidate
    content: |
      "Training" for an experimentation platform is about calibrating and validating the platform's statistical methods, not training a traditional ML model. The platform itself must be rigorously tested.

      **A/A testing (platform validation):**
      - Run continuous A/A tests: experiments where treatment and control get the identical experience
      - For a correctly functioning platform, A/A tests should show significant results at exactly the alpha rate (5% at alpha=0.05)
      - If >7% of A/A tests show significance, there is a systematic bias in the platform (data pipeline, assignment, or statistical method)
      - Netflix runs 100+ continuous A/A tests and treats them as integration tests for the entire experimentation stack

      **Empirical false positive rate calibration:**
      - For each metric, compute the empirical false positive rate from historical A/A tests
      - If metric X shows 8% false positives instead of 5%, the variance estimate for that metric is too low
      - Adjust: use bootstrap or jackknife variance estimates instead of analytical formulas
      - Common cause: user-level metrics are not truly independent (users in the same household, shared devices, bot rings)

      **Variance model training (for sample size calculators):**
      - Product teams need to know "how long should my experiment run?" before launching
      - This requires estimating the metric variance for their target population
      - Train a variance prediction model: given (metric, population segment, time period), predict the per-user variance
      - Use historical experiment data: for each past experiment, compute the realized variance and the pre-experiment predicted variance
      - Calibrate the variance model so that predicted confidence intervals achieve their nominal coverage rate (95% CIs should contain the true effect 95% of the time)

      **CUPED/CUPAC model training:**
      - For CUPAC (ML-based variance reduction), train prediction models for each major metric category
      - Features: 28-day pre-experiment user behavior, device type, country, account age, activity quintile
      - Model: LightGBM predicting the experiment-period metric value
      - Retrain monthly on the latest data to capture population shifts
      - Validate: CUPAC predictions should be uncorrelated with treatment assignment (verify for each new experiment)

      **Metric sensitivity analysis:**
      - For each metric, compute the "practical sensitivity": what is the minimum effect size detectable with 80% power given 1 week of data and our variance reduction?
      - Present this to experiment owners pre-launch: "With your target population of 10M users and CUPED, you can detect a 0.3% change in engagement within 7 days."
      - If the MDE (minimum detectable effect) is larger than the expected effect, recommend running longer or using a more sensitive proxy metric
    dialogue:
      - speaker: interviewer
        text: "How do you validate that the experimentation platform itself is working correctly? The platform is the foundation — if it is biased, every experiment decision is suspect."
      - speaker: candidate
        text: "A/A testing is the gold standard. Run continuous experiments where treatment and control are identical. The platform should detect significance at exactly the nominal rate — 5% at alpha 0.05. If it is higher, there is systematic bias."
      - speaker: interviewer
        text: "How many A/A tests do you need to validate the platform?"
      - speaker: candidate
        text: "Netflix runs over 100 continuously. I would start with at least 50 covering different metrics, platforms, and user segments. They serve as integration tests for the entire stack — assignment, data pipeline, metric computation, and statistical analysis."
      - speaker: interviewer
        text: "Good. What about the sample size calculator? Product teams need to plan experiment duration."
      - speaker: candidate
        text: "Train a variance prediction model on historical experiments. Given a metric and population, predict per-user variance, then compute the required sample size for the desired MDE and power. Validate by checking that predicted confidence intervals achieve nominal coverage on historical experiments."
    next: deploy_question

  # ======================================================================
  # STAGE 7: DEPLOYMENT (1 question node)
  # deploy_question -> (deploy_realtime | deploy_batch) -> mon_strategy (CONVERGE)
  # ======================================================================

  - id: deploy_question
    stage: deployment
    type: question
    label: "Platform Architecture"
    speaker: interviewer
    content: |
      How would you deploy the experimentation platform to serve 3,000+ concurrent experiments reliably? Think about the assignment service, metric computation, and the self-serve dashboard.
    dialogue:
      - speaker: interviewer
        text: "Deployment for an experimentation platform must handle 3,000+ concurrent experiments. What is the biggest architectural challenge?"
      - speaker: candidate
        text: "The assignment service must handle every user request — billions per day — with near-zero latency. And the metric computation pipeline must process 50B events daily without falling behind."
      - speaker: interviewer
        text: "How would you architect this?"
    choices:
      - label: "Embedded SDK with centralized analysis"
        answer: |
          I would deploy an **embedded client SDK** that handles experiment assignment locally, with centralized backend services for metric computation and analysis.

          **Assignment — embedded SDK approach:**
          - Lightweight SDK (< 50KB) embedded in web, iOS, and Android clients
          - SDK receives experiment configuration (experiment ID, salt, traffic percentage, targeting rules) via a CDN-cached config file, updated every 5 minutes
          - Assignment computed locally: `hash(user_id + salt) % 1000 < traffic_pct * 10`
          - No network call needed for assignment — zero added latency, zero dependency on a backend service

          **Why embedded SDK?**
          - **Zero latency**: Assignment is computed locally in < 1ms. No network round-trip needed.
          - **Zero availability dependency**: Even if the backend is down, experiments continue running correctly. The SDK has the assignment logic built in.
          - **Massive scale**: With 500M MAU making billions of requests daily, a centralized assignment service would need to handle 100K+ requests per second. The SDK eliminates this entirely.
          - **Consistent cross-surface assignment**: The same SDK logic on web, iOS, and Android guarantees consistent assignment across surfaces.

          **SDK features:**
          - **Experiment targeting**: SDK evaluates targeting rules locally (country, platform version, user segment). Only eligible users are enrolled.
          - **Event logging**: SDK logs exposure events (user saw the treatment) to Kafka via the existing event pipeline. Exposure logging enables intent-to-treat analysis.
          - **Feature flags integration**: Experiments are a special case of feature flags. The SDK supports both, enabling gradual rollouts that transition into measured experiments.
          - **Override support**: For debugging, developers can force-assign themselves to specific variants via URL parameters or debug menus.

          **Centralized analysis backend:**
          - Spark/Flink cluster processes event logs daily, computes metrics, runs statistical tests
          - Results written to PostgreSQL, served via REST API to the dashboard
          - Dashboard is a React SPA with D3 visualizations: experiment timelines, metric trends, confidence intervals, SRM checks

          **Config management:**
          - Experiment configurations stored in a database with a REST API for CRUD operations
          - Changes propagate to CDN within 5 minutes (acceptable for experiment launches, but instant for emergency kill-switches via push mechanism)
          - Config includes: experiment metadata, targeting rules, variant definitions, metric mappings, guardrail overrides

          **Trade-off:** SDK updates require app releases (for mobile). Breaking changes to the assignment logic require coordinated rollouts. Mitigation: keep the SDK extremely simple (assignment + logging only) and put all complexity in the backend.
        next: mon_strategy
      - label: "Server-side assignment service"
        answer: |
          I would deploy a **centralized server-side assignment service** that handles all experiment assignments via a high-availability API.

          **Architecture:**
          ```
          Client App (web/mobile/backend service)
               |
               v
          Assignment Service (gRPC, <5ms P99)
           |- Experiment Config Cache (local in-process, refreshed every 30s)
           |- Assignment Logic (consistent hashing per experiment)
           |- Exposure Logger (async to Kafka)
               |
               v
          Returns: { experiment_id: variant_id, ... } for all active experiments
          ```

          **Why server-side?**
          - **Instant configuration changes**: New experiments, traffic ramp-ups, and emergency shutdowns take effect immediately — no waiting for CDN propagation or app updates. For a platform running 3,000 experiments, the ability to instantly kill a problematic experiment is critical.
          - **Complex targeting**: Server-side can evaluate targeting rules using data not available on the client — user segmentation models, historical behavior, account-level features. Example: "only enroll users who have completed 5+ purchases" requires backend data.
          - **Backend experiments**: Many experiments are server-side only (algorithm changes, ranking models, API behavior). These cannot use a client SDK because there is no client.
          - **Audit trail**: Every assignment decision passes through a single service, enabling comprehensive logging and debugging.

          **High-availability design:**
          - 3 regional deployments with independent data
          - Each region: 50-100 pods on K8s, auto-scaling based on requests per second
          - P99 latency target: < 5ms (achieved by keeping experiment configs in local memory, not hitting a database per request)
          - Fallback: if the assignment service is unreachable, clients use a cached assignment from the last successful call (staleness limited to the cache TTL, typically 5 minutes)

          **Batch pre-computation for offline experiments:**
          - For experiments that do not need real-time assignment (email campaigns, weekly digest content), pre-compute all assignments in a daily batch job
          - Assignments stored in a lookup table: `(user_id, experiment_id) -> variant_id`
          - Avoids real-time service dependency for offline use cases

          **Scale considerations:**
          - 500M MAU x ~10 requests per user per day = 5 billion assignment lookups per day
          - Peak: ~200K requests per second
          - But each request resolves all active experiments for that user (batch lookup), so the per-experiment cost is amortized
          - With in-memory config and consistent hashing (pure compute, no I/O), each assignment takes < 100 microseconds

          **Trade-off:** Added network latency (1-5ms per request) compared to client-side SDK. Single point of failure risk (mitigated by multi-region deployment and client-side caching). Higher infrastructure cost. But the operational flexibility — instant changes, complex targeting, backend experiments — justifies the trade-off for a platform at this scale.
        next: mon_strategy

  # ======================================================================
  # STAGE 8: MONITORING (2 nodes)
  # mon_strategy (CONVERGENCE) -> mon_terminal
  # ======================================================================

  - id: mon_strategy
    stage: monitoring
    type: info
    label: "Platform Monitoring"
    speaker: candidate
    content: |
      Monitoring for an experimentation platform operates at two levels: **platform health** (is the system itself working correctly?) and **experiment health** (are individual experiments producing valid results?).

      **Platform health monitoring:**

      **Assignment system:**
      - Assignment throughput and latency (P50/P99). Alert if P99 > 10ms or throughput drops > 20%.
      - Assignment determinism: re-assign a random sample of 10,000 users every hour and verify assignments match the previous hour. Any mismatch indicates a bug in the hashing logic or config propagation.
      - Experiment config propagation lag: measure time from config change to client/server adoption. Alert if lag > 10 minutes (experiments are running on stale configs).

      **Metric computation pipeline:**
      - Pipeline latency: daily metric computation should complete within 6 hours of midnight UTC. Alert if it is not done by 8am UTC.
      - Event drop rate: compare events received in Kafka vs events processed by Spark. Drop rate > 0.1% indicates data loss.
      - Join completeness: percentage of events that successfully join with the assignment table. Should be > 99.5%. Lower rates indicate assignment logging issues.

      **Statistical validity (continuous A/A testing):**
      - Maintain 50+ A/A tests continuously
      - Dashboard showing: for each metric, the empirical false positive rate across A/A tests. Expected: 5% at alpha=0.05. Alert if >8% for any metric.
      - Check P-value uniformity: under the null hypothesis, p-values should be uniformly distributed. A QQ-plot of A/A p-values should follow the diagonal. Deviation indicates systematic bias.

      **Experiment health monitoring (per-experiment):**

      **Automated health checks (run daily for every active experiment):**
      1. **SRM check**: Chi-squared test on treatment vs control group sizes. Flag if p < 0.001.
      2. **Pre-experiment balance check**: Compare treatment and control on 10 pre-experiment covariates. If >2 show significant differences (at Bonferroni-corrected alpha), the randomization may have failed.
      3. **Time trend check**: Plot the treatment effect estimate over time. If it trends monotonically (steadily increasing or decreasing), there may be a novelty/primacy effect that will not persist.
      4. **Metric correlation check**: If the primary metric improves but correlated metrics show no change, the result may be an artifact. Example: "engagement increased 5%" but "time spent" and "sessions" are flat — suspicious.

      **Experiment lifecycle automation:**
      - Auto-start analysis when experiment reaches minimum sample size
      - Auto-alert when experiment reaches statistical significance (or when it is clear significance will not be reached within the planned duration)
      - Auto-summarize: generate a plain-language summary of results for the experiment review meeting
      - Auto-archive: after the ship decision, archive the experiment with results, decision, and decision-maker for future reference

      **Meta-analysis (quarterly):**
      - Across all experiments in the past quarter, what is the distribution of effect sizes? Are most changes having no impact? (Common — Netflix reports that ~80% of experiments show no statistically significant effect.)
      - Win rate by team and product area: which teams are shipping the most impactful changes? This informs resource allocation.
      - Metric reliability: which metrics are most sensitive to real changes? Prioritize these as primary metrics for future experiments.
    dialogue:
      - speaker: interviewer
        text: "How do you monitor the experimentation platform itself? The platform is the judge — if it is biased, all verdicts are wrong."
      - speaker: candidate
        text: "Two levels of monitoring. Platform health — assignment determinism, pipeline latency, event drop rates. And experiment health — SRM detection, pre-experiment balance checks, time trend analysis. Continuous A/A testing is the integration test for the entire stack."
      - speaker: interviewer
        text: "What about the meta-level — are experiments actually helping the company make better decisions?"
      - speaker: candidate
        text: "Quarterly meta-analysis. What percentage of experiments show significant results? What is the average effect size? Which teams have the highest win rates? This data informs experiment prioritization and resource allocation. Netflix reports that roughly 80% of experiments show no significant effect — understanding this base rate is critical for calibrating expectations."
      - speaker: interviewer
        text: "Excellent systems thinking. Let us wrap up."
    next: mon_terminal

  - id: mon_terminal
    stage: monitoring
    type: terminal
    label: "Interview Complete"
    speaker: interviewer
    content: |
      Excellent work! You have designed a comprehensive experimentation platform that addresses the key challenges of running A/B tests at scale.

      **Summary of your design:**
      1. **Problem definition**: Made a principled choice on randomization unit, considering statistical validity, network effects, and practical implementation
      2. **Metrics/Statistical framework**: Chose a statistical methodology that handles the peeking problem and provides actionable outputs for product teams
      3. **Data pipeline**: Designed a dual-path architecture (batch for accuracy, streaming for guardrails) processing 50B events per day
      4. **Data quality**: Addressed the most critical data quality challenge — whether SRM detection or metric definition consistency — with concrete detection and remediation strategies
      5. **Variance reduction**: Implemented techniques to detect smaller effects with less data, dramatically improving experiment velocity
      6. **ML capabilities**: Applied ML to make the platform smarter — whether through interference detection, bandits, or other advanced capabilities
      7. **Deployment**: Architected the assignment and analysis infrastructure for 3,000+ concurrent experiments with high availability
      8. **Monitoring**: Built multi-layered monitoring covering platform validity (A/A tests), experiment health (SRM, balance checks), and organizational impact (meta-analysis)

      **Areas for further exploration:**
      - How would you handle long-term effects? Some changes look good in a 2-week experiment but cause user fatigue over 6 months.
      - How do you handle experiments in two-sided marketplaces (Uber, Airbnb) where treating one side affects the other?
      - How would you build a culture of experimentation? Many experiment decisions are overridden by HiPPOs (Highest Paid Person's Opinion).
      - How would you handle experiments with rare but critical outcomes (crashes, security incidents) where standard statistical tests lack power?
      - How would you extend to causal inference beyond A/B tests (quasi-experiments, difference-in-differences, regression discontinuity)?

      This is a platform problem as much as an ML problem — the hardest part is not the statistics, it is building a system that thousands of product teams can use correctly, at scale, without making methodological errors. You demonstrated strong understanding of both the statistical foundations and the engineering challenges. Great interview!
    dialogue:
      - speaker: interviewer
        text: "Excellent work! You have designed a thorough experimentation platform covering randomization, statistical analysis, variance reduction, and platform monitoring."
      - speaker: candidate
        text: "Thank you. I think the most underappreciated aspect of experimentation platforms is the meta-level monitoring — ensuring the platform itself is valid. Continuous A/A testing is cheap to run but catches fundamental issues that would silently corrupt thousands of experiment decisions."
      - speaker: interviewer
        text: "Agreed. What would you prioritize for the first version of the platform?"
      - speaker: candidate
        text: "Three things: correct assignment with SRM detection, CUPED for variance reduction, and automated guardrail monitoring. These cover the most common failure modes: invalid randomization, underpowered experiments, and undetected regressions. Everything else can be added incrementally."
      - speaker: interviewer
        text: "That is exactly the right prioritization — correctness first, power second, automation third. Great interview!"
