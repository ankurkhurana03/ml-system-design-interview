id: experimentation-platform
title: "A/B Testing & Experimentation Platform"
description: "Design an ML-powered experimentation platform for running and analyzing A/B tests at scale."
companies: ["Netflix", "Meta", "Uber"]
domains: ["Tabular/Structured", "Time Series"]
root: pd_start

nodes:
  # ======================================================================
  # STAGE 1: PROBLEM DEFINITION (2 nodes)
  # pd_start -> pd_formulation (question) -> ...
  # ======================================================================

  - id: pd_start
    stage: problem_definition
    type: info
    label: "Problem Statement"
    speaker: interviewer
    content: |
      Welcome! Today we will design an ML-powered experimentation platform — the system that enables product teams to run, analyze, and learn from A/B tests at scale.

      **Company context:**
      - A large consumer internet company with 500 million monthly active users
      - Running 3,000+ concurrent experiments at any given time across web, mobile, and backend systems
      - Each experiment tests a product change (UI redesign, ranking algorithm update, pricing change, new feature rollout)
      - Current process is manual: data scientists write custom analysis notebooks for each experiment, taking 2-5 days per analysis

      **Current pain points:**
      - **Speed**: Experiment analysis takes too long. Product teams wait days for results, slowing iteration velocity.
      - **Quality**: Manual analyses are error-prone. A 2023 internal audit found that 12% of experiment decisions were based on flawed statistical analysis (p-hacking, peeking, wrong metric definitions).
      - **Interference**: With 3,000 concurrent experiments, many users are in multiple experiments simultaneously. Interactions between experiments can invalidate results.
      - **Sensitivity**: Many experiments produce small but important effects (0.1-0.5% improvement in engagement). Current analysis methods often lack the statistical power to detect these effects reliably.

      **Platform requirements:**
      - Automated experiment analysis with correct statistical methodology
      - Metric computation pipeline handling 50+ billion events per day
      - Variance reduction to detect smaller effects with less data
      - Interaction detection between concurrent experiments
      - Guardrail metrics that automatically flag regressions in key metrics (latency, crash rate, revenue)
      - Self-serve dashboard for product teams (no data scientist needed for standard analyses)

      Let us start with a fundamental design decision about the randomization unit.
    dialogue:
      - speaker: interviewer
        text: "Welcome! We are designing an experimentation platform for a company with 500 million MAU running 3,000+ concurrent experiments. What is the most fundamental design decision?"
      - speaker: candidate
        text: "The randomization unit — what entity do we assign to treatment vs control. This choice affects everything: the statistical analysis, metric computation, and how we handle network effects and interference."
      - speaker: interviewer
        text: "Exactly. And with 3,000 concurrent experiments, we need to worry about how randomization units interact across experiments."
      - speaker: candidate
        text: "Right. The randomization unit also determines our sample size and statistical power. User-level randomization gives us 500M units but users have high variance. Event-level gives more samples but violates independence assumptions."
      - speaker: interviewer
        text: "Good thinking. Let us explore the options."
    next: pd_formulation

  - id: pd_formulation
    stage: problem_definition
    type: question
    label: "Randomization Unit"
    speaker: interviewer
    content: |
      What should be the primary randomization unit for the experimentation platform? This decision affects statistical power, metric computation complexity, and how we handle network effects.
    dialogue:
      - speaker: interviewer
        text: "What randomization unit would you choose? User-level, session-level, or something else?"
      - speaker: candidate
        text: "Each has trade-offs. User-level is the most common and cleanest statistically, but session-level gives faster results. There is also the question of whether we need different units for different experiment types."
      - speaker: interviewer
        text: "Walk me through your recommendation."
    choices:
      - label: "User-level with consistent hashing"
        answer: |
          I would use **user-level randomization** with consistent hashing as the primary randomization mechanism.

          **How it works:**
          - Each experiment gets a unique salt (experiment ID)
          - Assignment: `bucket = hash(user_id + experiment_salt) % 1000`
          - Buckets 0-499 = control, 500-999 = treatment (for a 50/50 split)
          - The hash is deterministic: the same user always gets the same assignment for a given experiment, regardless of when or how they access the product

          **Why user-level?**
          - **Statistical validity**: Users are independent units. Session-level randomization violates independence — the same user in different sessions could be in treatment and control, contaminating both groups.
          - **Consistent experience**: A user sees the same variant across all sessions and devices. This prevents confusion (seeing the new UI on mobile but old UI on web) and enables measurement of long-term behavioral effects.
          - **Network effect handling**: For social features, user-level assignment enables cluster-based randomization extensions (assign friend groups together) when needed.

          **Consistent hashing benefits:**
          - No centralized assignment service needed — any system can independently compute a user's assignment given the experiment salt. This eliminates a single point of failure and reduces latency.
          - Assignments survive system restarts — no state to persist or recover.
          - Orthogonal assignments: with different salts, experiment assignments are independent. User in treatment for Experiment A has a 50/50 chance of being in treatment for Experiment B.

          **Multi-experiment layering (Netflix/Google approach):**
          - Divide the user space into **layers** (e.g., UI layer, ranking layer, infrastructure layer)
          - Within each layer, experiments are mutually exclusive (a user is in at most one experiment per layer)
          - Across layers, experiments are orthogonal (independent random assignment)
          - This prevents conflicting experiments (two UI changes on the same page) while allowing independent experiments to coexist

          **Limitation:** For experiments affecting non-logged-in users or for very short experiments where we need results within hours, user-level randomization requires a large user base. With 500M MAU, this is rarely a problem, but niche features with small eligible populations may need alternative approaches.
        next: met_analysis
      - label: "Cluster-based randomization"
        answer: |
          I would use **cluster-based randomization** — assigning groups of related users (clusters) to treatment or control rather than individual users.

          **How it works:**
          - Partition users into clusters based on social connections, geographic proximity, or marketplace interactions
          - For a social network: clusters are friend groups or connected components of the social graph
          - For a marketplace: clusters are geographic regions or user segments that interact (buyers and sellers in the same market)
          - Entire clusters are assigned to treatment or control: `assignment = hash(cluster_id + experiment_salt) % 1000`

          **Why cluster-based?**
          - **Handles network effects**: When treatment affects not just the treated user but their connections (e.g., a new sharing feature, a feed algorithm change, a marketplace pricing change), individual randomization is biased because control users are "contaminated" by treated friends. Meta's research showed that individual-level randomization can underestimate social feature effects by 20-50%.
          - **Interference mitigation**: With 3,000 concurrent experiments, user interactions create interference. If Experiment A changes how User 1 shares content, it affects User 2 (in control for Experiment A) who sees that shared content. Cluster randomization contains interference within clusters.

          **Cluster construction strategies:**
          - **Social graph clusters**: Use community detection algorithms (Louvain, Label Propagation) to partition the social graph into groups of 50-500 users. Users within a cluster interact frequently; cross-cluster interactions are rare.
          - **Geographic clusters**: For marketplace experiments (Uber pricing, Airbnb search), use geographic regions (cities, zip codes) as clusters. A pricing change in San Francisco should not leak into Oakland's control group.
          - **Time-based clusters**: For content experiments, use time slots — all users during hour X see treatment, hour Y see control. Simple but introduces temporal confounders (morning vs evening behavior differs).

          **Statistical implications:**
          - Fewer independent units (N_clusters << N_users), which reduces statistical power. If we have 500M users in 100,000 clusters, our effective sample size is ~100,000, not 500M.
          - Variance of the treatment effect estimator depends on the intra-cluster correlation (ICC). If ICC is high (users within a cluster behave similarly), power is much lower.
          - To compensate, experiments need to run longer or use variance reduction techniques.

          **Trade-off:** More complex infrastructure (need a cluster assignment service, cluster graph updates as users join/leave), lower statistical power, and cluster definitions can become stale as social connections evolve. But for social/marketplace products where network effects are the core mechanism, cluster randomization is essential for unbiased estimates.
        next: met_analysis

  # ======================================================================
  # STAGE 2: METRICS (1 question node)
  # met_analysis (question) -> (met_frequentist | met_bayesian) -> data_pipeline (CONVERGE)
  # ======================================================================

  - id: met_analysis
    stage: metrics
    type: question
    label: "Statistical Framework"
    speaker: interviewer
    content: |
      Now let us decide on the statistical framework for analyzing experiments. This determines how we compute p-values, confidence intervals, and make ship/no-ship decisions. The choice between frequentist and Bayesian approaches has significant implications for how product teams interact with the platform.
    dialogue:
      - speaker: interviewer
        text: "What statistical framework should the platform use? Frequentist hypothesis testing or Bayesian inference? This affects how product teams interpret results and make decisions."
      - speaker: candidate
        text: "Both are valid but serve different organizational cultures. Frequentist methods have well-established error rate guarantees. Bayesian methods give more intuitive outputs — direct probability statements about the treatment effect."
      - speaker: interviewer
        text: "Which would you recommend for this platform?"
    choices:
      - label: "Frequentist with sequential testing"
        answer: |
          I would use **frequentist hypothesis testing with sequential testing** (always-valid p-values) to allow continuous monitoring without inflating false positive rates.

          **The peeking problem:**
          Traditional fixed-horizon tests require a predetermined sample size. But product teams peek at results daily — and they should, because detecting a severe regression (crash rate spike) early is critical. However, repeated peeking inflates false positive rates from the nominal 5% to as high as 30%.

          **Solution — always-valid sequential testing:**
          - Use **mixture sequential probability ratio test (mSPRT)** or **anytime-valid confidence sequences**
          - These methods maintain valid Type I error control regardless of when you look at the data. You can check results every hour and stop the experiment as soon as significance is reached, without alpha inflation.
          - Uber and Netflix use variants of this approach. Netflix's blog reported that sequential testing reduced experiment duration by 20-30% on average while maintaining statistical rigor.

          **Implementation:**
          - At each time point t, compute the e-value (a measure of evidence against the null hypothesis) using the wealth process formulation
          - Reject H0 when e-value > 1/alpha (typically > 20 for alpha=0.05)
          - This is equivalent to a confidence sequence: a sequence of confidence intervals that are simultaneously valid at all time points

          **Variance reduction (CUPED):**
          - **CUPED (Controlled-experiment Using Pre-Experiment Data)**: Reduce metric variance by regressing out pre-experiment behavior. If a user had high engagement last month, they are likely to have high engagement this month regardless of treatment.
          - Formula: `Y_adjusted = Y - theta * (X_pre - mean(X_pre))` where theta is the regression coefficient of Y on X_pre
          - Typical variance reduction: 20-50%, which translates to 20-50% shorter experiment duration or ability to detect 20-50% smaller effects
          - Microsoft and Netflix report that CUPED is their single most impactful infrastructure investment for experimentation

          **Guardrail metrics with Bonferroni correction:**
          - Track 10-20 guardrail metrics (latency, crash rate, revenue, error rate) alongside primary metrics
          - Apply Bonferroni correction for multiple testing: if checking 20 guardrails at alpha=0.05, use alpha=0.0025 per metric
          - Alert product teams immediately if any guardrail shows statistically significant degradation, even if primary metrics look positive

          **Trade-off:** Sequential testing is more conservative (wider confidence intervals at any given time point) and requires more complex infrastructure than a simple t-test. But the benefits — valid peeking, faster decisions, and no p-hacking — are essential at scale.
        next: data_pipeline
      - label: "Bayesian inference with decision rules"
        answer: |
          I would use **Bayesian inference** with practical decision rules based on posterior probabilities.

          **Why Bayesian for experimentation?**
          The output is directly what product teams want to know: "What is the probability that the treatment is better?" Instead of a p-value (which is commonly misinterpreted), the platform reports: "There is an 94% probability that the new ranking algorithm improves engagement by 0.5-2.1%."

          **Implementation:**
          - Model the metric difference as a Normal distribution: `delta ~ N(mu, sigma^2)`
          - Prior: weakly informative `N(0, sigma_prior^2)` where sigma_prior reflects reasonable effect sizes for this metric category (e.g., engagement changes rarely exceed 5%)
          - Update the posterior as data accumulates. No need for a fixed sample size — the posterior continuously reflects current evidence.
          - Report: posterior mean, 95% credible interval, and the key decision probability: `P(delta > 0)` and `P(delta > MDE)` where MDE is the minimum detectable effect that is practically significant

          **Decision rules (replacing p-value thresholds):**
          - **Ship**: P(treatment is better by at least MDE) > 95%. This means we are 95% confident the effect is not just positive but practically meaningful.
          - **Do not ship**: P(treatment is worse by more than -MDE) > 80%. High confidence the change is actively harmful.
          - **Continue**: Neither threshold met. Collect more data.
          - **Inconclusive**: After maximum experiment duration (e.g., 4 weeks), if neither threshold is met, the effect is likely too small to matter. Ship based on non-statistical criteria (code simplicity, maintenance burden).

          **Metric-specific priors (a Bayesian superpower):**
          - Use historical experiment results to inform priors. If we have run 500 experiments on the ranking algorithm, we know the empirical distribution of effect sizes: most changes have < 0.5% impact, a few have 1-3% impact.
          - This **empirical Bayes** approach dramatically improves power for detecting small effects and reduces false positives from noisy experiments.
          - Netflix published that empirical Bayes priors reduced their false discovery rate by 40% compared to uninformative priors.

          **Guardrail metrics:**
          - Compute posterior probability of regression for each guardrail metric
          - Alert if P(guardrail regression > threshold) > 80%
          - The threshold is metric-specific: for latency, regression = +50ms; for crash rate, regression = +0.1%; for revenue, regression = -0.5%

          **Trade-off:** Bayesian computation is more expensive (MCMC or variational inference vs a simple t-test). Prior selection requires careful thought and can influence results, especially for small experiments. Some stakeholders (data scientists with frequentist training) may resist the paradigm shift. But for product teams, Bayesian outputs are far more intuitive and actionable.
        next: data_pipeline

