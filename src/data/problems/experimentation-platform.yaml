  - id: data_pipeline
    stage: data
    type: info
    label: "Metric Computation Pipeline"
    speaker: interviewer
    content: |
      The metric computation pipeline is the backbone of the experimentation platform. It must process 50+ billion events per day, compute hundreds of metrics per experiment, and deliver results with low latency.

      **Data architecture:**

      | Layer | Technology | Purpose | Latency |
      |-------|-----------|---------|---------|
      | Event ingestion | Kafka (partitioned by user_id) | Raw event stream | Real-time |
      | Event storage | S3 + Delta Lake / Iceberg | Immutable event log | Minutes |
      | Assignment service | Redis + consistent hashing | Which user is in which experiment | <5ms |
      | Metric definitions | YAML config in Git | Declarative metric specs | N/A |
      | Batch computation | Spark/Flink on Delta Lake | Daily metric aggregation | 4-6 hours |
      | Streaming computation | Flink on Kafka | Real-time guardrail monitoring | <1 minute |
      | Results storage | PostgreSQL/ClickHouse | Experiment statistics, p-values | N/A |
      | Dashboard | React + D3 | Self-serve experiment monitoring | Real-time |

      **Metric computation approach — two paths:**

      **Batch path (primary, for final analysis):**
      1. Every 24 hours, Spark jobs join the event log with the assignment table
      2. For each experiment, compute per-user metric values (e.g., daily active minutes, revenue, click-through rate)
      3. Aggregate to treatment vs control groups
      4. Run statistical tests (sequential or Bayesian depending on framework choice)
      5. Update the dashboard with latest results

      **Streaming path (guardrails, near real-time):**
      1. Flink jobs continuously process the Kafka event stream
      2. For guardrail metrics (latency, error rate, crash rate), compute running statistics per experiment group
      3. If any guardrail crosses the alert threshold, trigger immediate notification to experiment owner and on-call
      4. This path is approximate (5-10% variance from batch due to late-arriving events) but fast

      **Scale considerations:**
      - 50B events/day across 3,000 experiments = ~167M events per experiment per day on average
      - But distribution is highly skewed: some experiments have 500M+ events (full traffic), others have 100K (niche feature tests)
      - Metric computation is embarrassingly parallel by experiment — but join with assignment table is the bottleneck

      Let us discuss the most critical data quality challenge.
    dialogue:
      - speaker: interviewer
        text: "The metric computation pipeline processes 50 billion events per day. How would you balance batch accuracy with streaming speed?"
      - speaker: candidate
        text: "Two parallel paths. Batch computation on Delta Lake for accurate final analysis — joins events with assignments, computes per-user metrics, runs statistical tests daily. Streaming via Flink for real-time guardrail monitoring — approximate but fast enough to catch regressions within minutes."
      - speaker: interviewer
        text: "What happens when the two paths disagree?"
      - speaker: candidate
        text: "The batch path is the source of truth. Streaming can have 5-10% variance due to late-arriving events and approximations. If the streaming path triggers a guardrail alert, we verify with the batch path before making ship decisions. Streaming is an early warning system, not a decision-making system."
      - speaker: interviewer
        text: "Good distinction. What is the biggest data quality challenge?"
    next: data_quality

  - id: data_quality
    stage: data
    type: question
    label: "Data Quality Challenge"
    speaker: interviewer
    content: |
      With 3,000 concurrent experiments and 50B daily events, data quality is a massive challenge. What is the most critical data quality issue for the experimentation platform?
    dialogue:
      - speaker: interviewer
        text: "With 3,000 concurrent experiments, what data quality issue worries you most?"
      - speaker: candidate
        text: "Two big concerns: sample ratio mismatch — when treatment and control group sizes are not what we expected — and metric definition inconsistency — when the same metric means different things to different teams."
      - speaker: interviewer
        text: "Pick the one you think is more impactful and explain your approach."
    choices:
      - label: "Sample Ratio Mismatch (SRM) detection"
        answer: |
          **Sample Ratio Mismatch (SRM)** is the most critical data quality check for an experimentation platform. An SRM means the actual ratio of users in treatment vs control differs from the intended ratio — and it invalidates the entire experiment.

          **Why SRM is so dangerous:**
          If we intended 50/50 but observe 51/49, something is wrong with the randomization, data pipeline, or triggering logic. The groups are no longer comparable, so any observed treatment effect could be an artifact of the imbalance rather than the actual treatment. Microsoft's experimentation team found that ~6% of experiments had statistically significant SRMs, and decisions based on SRM-affected experiments were wrong 50% of the time.

          **SRM detection system:**
          - Run a chi-squared test on the observed vs expected group sizes for every experiment, every day
          - Chi-squared test: `chi2 = sum((observed_i - expected_i)^2 / expected_i)` with df = num_groups - 1
          - Alert threshold: p < 0.001 (more stringent than usual because SRM is a data quality issue, not a treatment effect)
          - At 3,000 experiments with alpha=0.001, we expect ~3 false alarms per day. Acceptable.

          **Common SRM causes (ranked by frequency):**
          1. **Bot filtering**: Treatment might attract different bot traffic patterns. If bot filters remove more bots from one group, the counts diverge.
          2. **Triggering conditions**: The experiment trigger (e.g., "user loads the feed") may fire differently in treatment vs control due to latency differences.
          3. **Redirects and page loads**: In web experiments, treatment pages might load slower, causing more users to leave before being counted.
          4. **Client caching**: Mobile app experiments where the old version is cached — users in treatment might not see the new version until app restart.

          **Automated SRM investigation:**
          When SRM is detected, automatically compute:
          - SRM by platform (web/iOS/Android) — if SRM exists only on one platform, it is likely a client-side bug
          - SRM by user segment (new vs returning, country) — localized SRM points to a specific triggering issue
          - SRM over time — did it start on a specific date (suggests a deployment broke something)?

          **SRM response protocol:**
          - SRM detected → experiment automatically flagged as "unhealthy" in dashboard
          - Experiment owner notified with investigation report
          - Results are hidden until SRM is resolved (prevent decisions based on invalid data)
          - If SRM cannot be resolved, experiment must be restarted with root cause fixed
        next: feat_question
      - label: "Metric definition consistency"
        answer: |
          **Metric definition inconsistency** is the most critical data quality issue because it silently corrupts decision-making across the organization without triggering any alarms.

          **The problem:**
          At a company running 3,000 experiments, different teams define "the same" metric differently:
          - Team A defines "daily active users" as users who logged in. Team B defines it as users who performed any action (including background syncs). Team C defines it as users who performed a "meaningful" action. All three report "DAU" but measure different things.
          - "Revenue" might include or exclude refunds, taxes, subscription renewals, or promotional credits depending on who computed it.
          - "Click-through rate" denominator might be "impressions served" or "impressions viewed" or "impressions above the fold" — the numerator might be "clicks" or "unique clicks."

          **Impact:** Microsoft's analysis found that metric definition inconsistency caused more erroneous experiment decisions than statistical errors. Teams celebrating a "2% improvement in engagement" might actually be measuring a different engagement definition than the one the VP is tracking.

          **Solution — centralized metric registry:**
          - Every metric is defined ONCE in a central YAML-based metric registry stored in Git
          - Each definition includes: metric name, SQL/code for computation, unit of analysis, denominator definition, numerator definition, known caveats, and owner
          - Example metric definition:
            ```yaml
            metric: daily_active_users
            description: "Count of unique users who performed at least one intentional action"
            sql: "SELECT COUNT(DISTINCT user_id) FROM events WHERE event_type IN ('click', 'scroll', 'search', 'purchase') AND date = :date"
            exclude: "bot traffic, background syncs, automated actions"
            denominator: "all enrolled users"
            owner: "data-platform-team"
            last_reviewed: "2025-01-15"
            ```

          **Governance process:**
          - New metrics must be reviewed by the data platform team before registration
          - Changes to existing metrics require approval and trigger re-analysis of all active experiments using that metric
          - Dashboard shows the exact metric definition on hover — no ambiguity about what is being measured
          - Quarterly metric audit: review top 50 metrics for consistency, remove duplicates, update documentation

          **Metric taxonomy:**
          - **Primary metrics**: The main metric each experiment optimizes (1-2 per experiment). Must be pre-registered before experiment launch.
          - **Guardrail metrics**: 15-20 company-wide metrics that every experiment monitors (latency, crash rate, revenue, etc.). Defined centrally, not customizable per experiment.
          - **Exploratory metrics**: Team-specific metrics for post-hoc analysis. Clearly labeled as exploratory to prevent p-hacking.

          This approach eliminates "metric shopping" (choosing whichever metric definition makes results look best) and ensures all teams speak the same quantitative language.
        next: feat_question

  # ======================================================================
  # STAGE 4: FEATURES (1 question node)
  # feat_question (CONVERGENCE) -> (feat_cuped | feat_stratification) -> mod_question (CONVERGE)
  # ======================================================================

  - id: feat_question
    stage: features
    type: question
    label: "Variance Reduction Strategy"
    speaker: interviewer
    content: |
      Variance reduction is the "feature engineering" of experimentation — it uses pre-experiment data to reduce noise and increase statistical power. Which variance reduction technique would you prioritize implementing first?
    dialogue:
      - speaker: interviewer
        text: "Variance reduction is arguably the most impactful investment for an experimentation platform. Which technique would you prioritize?"
      - speaker: candidate
        text: "The two main approaches are CUPED — using pre-experiment covariates to reduce variance — and stratified sampling to ensure balanced groups. Both are well-proven but have different implementation complexity."
      - speaker: interviewer
        text: "Which would you implement first and why?"
    choices:
      - label: "CUPED (pre-experiment covariate adjustment)"
        answer: |
          I would prioritize **CUPED (Controlled-experiment Using Pre-Experiment Data)** — it typically delivers the largest variance reduction with minimal implementation complexity.

          **How CUPED works:**
          The key insight is that most of the variance in experiment metrics comes from pre-existing user differences, not the treatment. If we can subtract out this pre-existing variance, we get a much cleaner signal.

          **Formula:**
          ```
          Y_adjusted = Y - theta * (X_pre - mean(X_pre))
          ```
          Where:
          - Y = the experiment metric (e.g., engagement during the experiment)
          - X_pre = the same metric measured pre-experiment (e.g., engagement in the 2 weeks before the experiment)
          - theta = Cov(Y, X_pre) / Var(X_pre) — the optimal regression coefficient

          The adjusted metric Y_adjusted has the same expected value as Y (unbiased) but lower variance.

          **Practical implementation:**
          - For each experiment, automatically compute the pre-experiment value of the primary metric for every user (typically 7-28 day lookback)
          - Compute theta on the combined dataset (treatment + control)
          - Apply the adjustment before running statistical tests
          - Report both raw and CUPED-adjusted results (transparency)

          **Variance reduction in practice:**
          - Microsoft: 50%+ variance reduction for engagement metrics (meaning experiments need ~50% fewer users to detect the same effect)
          - Netflix: 20-40% variance reduction across most metrics
          - Uber: 30-60% variance reduction for marketplace metrics
          - The reduction is highest for metrics with strong temporal autocorrelation (engagement, revenue) and lowest for binary metrics (conversion, crash rate)

          **Extension — CUPAC (Controlled-experiment Using Predictions As Covariates):**
          - Instead of using the raw pre-experiment metric as X_pre, train an ML model to predict the experiment metric from multiple pre-experiment features
          - The ML prediction is a better covariate than any single feature because it captures more of the pre-existing variance
          - DoorDash reported that CUPAC achieved 60-70% variance reduction vs 40% for basic CUPED
          - Implementation: train a LightGBM model on pre-experiment features (prior 28 days of activity, device type, account age, etc.) to predict the metric. Use the model's prediction as the covariate.

          **Trade-off:** CUPED requires pre-experiment data, so it does not work for new users who join during the experiment. For these users, fall back to unadjusted metrics. Also, if the pre-experiment period had unusual events (site outage, holiday), the covariate can introduce bias. Mitigation: exclude anomalous pre-experiment days.
        next: mod_question
      - label: "Stratified sampling with post-stratification"
        answer: |
          I would prioritize **stratified sampling with post-stratification** — ensuring balanced treatment/control groups across key dimensions and adjusting estimates accordingly.

          **Why stratification?**
          User populations are heterogeneous. Power users (top 5%) generate 50%+ of total engagement. Country-level differences in behavior are enormous. Device type (iOS vs Android) affects metric distributions. If, by chance, treatment gets more power users than control, it will look better regardless of the actual treatment effect. Stratification prevents this.

          **Pre-stratification (at assignment time):**
          - Define 5-10 strata based on: user activity level (quintiles), country/region, platform (web/iOS/Android), account age (new vs established)
          - Within each stratum, randomly assign 50/50 to treatment and control
          - This guarantees balanced groups across these dimensions — no accidental imbalances
          - Implementation: `bucket = hash(user_id + experiment_salt + stratum_id) % 1000`

          **Post-stratification (at analysis time):**
          - Even without pre-stratification, we can improve precision by adjusting for known covariates post-hoc
          - Compute the treatment effect within each stratum, then take a weighted average
          - Formula: `ATE_stratified = sum(w_s * ATE_s)` where w_s is the stratum weight (proportion of population in stratum s) and ATE_s is the within-stratum average treatment effect
          - This reduces variance because within-stratum variance is lower than total variance

          **Variance reduction estimates:**
          - Post-stratification by activity level alone: 10-25% variance reduction
          - Post-stratification by activity + country + platform: 20-40% variance reduction
          - Less than CUPED for most metrics, but has an advantage: it works for any metric without needing a pre-experiment covariate

          **Stratification for guardrails:**
          - Critical for guardrail metrics where small subgroups might be disproportionately affected
          - Example: a new feature might crash only on older Android devices. If we do not stratify by device type, the overall crash rate might look fine while a subset of users is having a terrible experience.
          - Stratified analysis automatically surfaces: "crash rate increased by 5x for Android users on version < 10, who are 3% of the population"

          **Combining with CUPED:**
          - Stratification and CUPED are complementary, not competing
          - Best practice: apply CUPED within each stratum for maximum variance reduction
          - The combined approach typically achieves 40-60% variance reduction

          **Trade-off:** Pre-stratification requires defining strata before the experiment, which limits flexibility. Too many strata (more than 100) create small subgroups with high variance. Post-stratification avoids these issues but provides less variance reduction than pre-stratification.
        next: mod_question

