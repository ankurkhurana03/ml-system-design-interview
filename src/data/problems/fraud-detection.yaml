      - **Anomaly timeline**: Timeline view of unusual patterns (sudden spike in high-risk scores from a specific BIN range)
      - **Attack detection**: Automated detection of coordinated fraud attacks (many cards, same merchant, short timeframe)

      **Feedback loops for continuous improvement:**
      1. **Merchant feedback**: Merchants can report false declines via API -- these feed directly into training labels
      2. **Fraud analyst feedback**: Manual review decisions become training labels (faster than chargeback cycle)
      3. **Rule suggestions**: When analysts identify patterns, ML team evaluates if a new rule or model retrain addresses it
      4. **Automated feature importance tracking**: Alert when a previously important feature loses predictive power (signals adversarial adaptation)

      **Incident response playbook:**
      - Fraud spike detected -> Tighten thresholds temporarily -> Root cause analysis -> Rule or model update -> Revert thresholds
      - Model degradation detected -> Roll back to previous version -> Diagnose -> Fix and redeploy

