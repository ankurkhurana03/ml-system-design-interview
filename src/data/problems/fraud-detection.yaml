  - id: mon_ab
    stage: monitoring
    type: info
    label: "A/B Testing Framework Details"
    speaker: interviewer
    content: |
      Great approach with the champion/challenger framework. Let's detail the implementation.

      **Evaluation pipeline:**

      ```
      Daily batch job:
      1. Pull all scored transactions from yesterday
      2. Join with available labels (customer reports, issuer alerts)
      3. Compute per-model metrics:
         - Estimated recall (using early labels)
         - Precision at fixed recall thresholds
         - Score calibration (are probabilities well-calibrated?)
         - Segment-level performance
      4. Update dashboard
      5. Run statistical tests (Bayesian)
      6. Alert if challenger significantly better or champion degrading
      ```

      **Handling the counterfactual problem:**
      - We only observe outcomes for the champion's decisions (approved/declined)
      - For declined transactions, we don't know if they were truly fraud
      - **Solution 1**: Periodic "random approval" of 0.1% of transactions the champion would decline -- observe outcomes to get unbiased recall estimates
      - **Solution 2**: Use issuer-level fraud reports (TC40 data) which arrive regardless of our decision
      - **Solution 3**: Inverse propensity weighting for off-policy evaluation

      **Long-term model evolution tracking:**
      - Track model performance over months -- is each generation genuinely improving?
      - Maintain a "model zoo" of past champions for regression testing
      - Annual review: Has the fraud detection rate improved year-over-year? Is the cost-per-prevented-fraud-dollar improving?

      **Key insight from industry:** Visa reports that the best fraud detection systems are **not just ML** -- they're a combination of ML models, expert rules, velocity checks, and human review. The monitoring system should track the performance of the **entire stack**, not just the ML component.
    dialogue:
      - speaker: interviewer
        text: "How do you evaluate model performance on transactions the champion declined?"
      - speaker: candidate
        text: "This is the counterfactual problem. I'd use three approaches: occasional random approval of a tiny sample, issuer fraud reports that arrive regardless of our decision, and inverse propensity weighting for off-policy evaluation."
      - speaker: interviewer
        text: "The random approval approach is interesting but risky. How do you manage that risk?"
      - speaker: candidate
        text: "Very carefully. Only approve 0.1% of declines, cap at low dollar amounts ($50 max), exclude the highest-risk scores, and have a rapid response team monitoring these transactions. The business cost is small but the evaluation signal is invaluable."
    next: mon_terminal_ab

