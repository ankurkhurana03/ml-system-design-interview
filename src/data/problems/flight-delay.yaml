id: flight-delay
title: "Flight Delay Prediction"
description: "Design an ML system to predict flight delays for a major airline, covering problem formulation through production monitoring."
companies: ["Google", "Amazon", "Uber", "United Airlines", "Delta"]
domains: ["Time Series", "Tabular/Structured", "Prediction"]
root: pd_start

nodes:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: PROBLEM DEFINITION (5 nodes)
  # pd_start → pd_scope → pd_data_available → pd_formulation (question) → ...
  # ═══════════════════════════════════════════════════════════════════════════

  - id: pd_start
    stage: problem_definition
    type: info
    label: "Problem Statement"
    speaker: interviewer
    content: |
      Welcome! Today we'll design an ML system for a major airline. They want to predict flight delays to improve customer experience and operational efficiency.

      **The airline's scale:**
      - 2,000+ daily flights across 200 airports
      - 45 million passengers per year
      - Revenue impact of delays: ~$8B industry-wide annually

      **Current pain points:**
      - Passengers learn about delays only at the gate, leading to missed connections and frustration
      - Operations teams scramble reactively — gate reassignments, crew swaps, and aircraft substitutions happen ad hoc
      - Customer service centers are overwhelmed during disruptions

      **What they want:**
      - Proactive passenger notifications (push alerts hours before departure)
      - An operations dashboard with predicted delays for resource planning
      - Integration with rebooking systems to offer alternatives before delays cascade

      Let's start by scoping the problem.
    dialogue:
      - speaker: interviewer
        text: "Welcome! Today we'll design an ML system for a major airline that wants to predict flight delays. The airline operates over 2,000 daily flights across 200 airports."
      - speaker: candidate
        text: "That's a substantial operation. What's driving this initiative — is it primarily customer-facing or operations-focused?"
      - speaker: interviewer
        text: "Both, actually. Passengers currently only learn about delays at the gate, and operations teams scramble reactively. They want proactive notifications and predictive dashboards."
      - speaker: candidate
        text: "Understood. So we're building a system that serves two distinct user groups with different latency and precision needs. I'd like to understand the scale and data available before we scope further."
      - speaker: interviewer
        text: "Good instinct. Let's start by clarifying the requirements."
    next: pd_scope

  - id: pd_scope
    stage: problem_definition
    type: multi_select
    label: "Clarifying Questions"
    speaker: interviewer
    content: |
      Before we proceed, let's scope the problem by clarifying several dimensions. Your choices will shape the system design approach throughout the interview.

      Think about what assumptions would make sense for a real airline system — there's no single "right" answer, but your choices should be internally consistent.
    dimensionGroups:
      - id: system_reqs
        label: "System Requirements"
        dimensions:
          - id: prediction_horizon
            label: "Prediction Horizon"
            description: "When do we need predictions relative to departure?"
            options:
              - value: short_term
                label: "Short-term (2h before)"
              - value: long_term
                label: "Long-term (24h before)"
              - value: multi_horizon
                label: "Multi-horizon (both)"
          - id: latency
            label: "Latency Requirement"
            description: "How quickly must predictions be served?"
            options:
              - value: real_time
                label: "Real-time (<100ms)"
              - value: batch
                label: "Batch (hourly)"
              - value: near_real_time
                label: "Near real-time (<5s)"
      - id: business_constraints
        label: "Business Constraints"
        dimensions:
          - id: primary_user
            label: "Primary User"
            description: "Who is the main consumer of delay predictions?"
            options:
              - value: passengers
                label: "Passengers"
              - value: operations
                label: "Operations Team"
              - value: both
                label: "Both"
          - id: delay_definition
            label: "Delay Definition"
            description: "How should we define and predict delays?"
            options:
              - value: binary
                label: "Binary (delayed/not)"
              - value: categorical
                label: "Categorical (on-time/minor/major)"
              - value: continuous
                label: "Continuous (minutes)"
    routes:
      - key: "multi_horizon|real_time|both|continuous"
        next: pd_data_available
      - key: "short_term|real_time|operations|binary"
        next: pd_data_available
      - key: "long_term|batch|passengers|categorical"
        next: pd_data_available
    defaultRoute: pd_data_available
    dialogue:
      - speaker: interviewer
        text: "Before we dive into the design, I'd like you to make some scoping decisions. What prediction horizon makes sense?"
      - speaker: candidate
        text: "I think we need multi-horizon predictions. 24 hours out for passenger notifications, and 2 hours out for operational adjustments — the available features and accuracy will differ significantly between horizons."
      - speaker: interviewer
        text: "Good reasoning. What about latency and the primary user?"
      - speaker: candidate
        text: "Both passengers and operations need this, but with different interfaces. For latency, near real-time seems practical — we don't need sub-100ms for this use case, but hourly batch would be too stale for the 2-hour horizon."
      - speaker: interviewer
        text: "Solid choices. Let's look at the data we have available."

  - id: pd_data_available
    stage: problem_definition
    type: info
    label: "Available Data"
    speaker: interviewer
    content: |
      Excellent scoping choices. Here's what data the airline has available:

      **Historical flight data (5 years):**
      - Scheduled vs. actual departure/arrival times for every flight
      - Cancellation records with reason codes (weather, mechanical, crew, ATC)
      - Aircraft tail numbers and rotation schedules (which plane flies which legs)

      **External data sources:**
      - NOAA historical weather observations and NWS forecasts (temperature, wind, precipitation, visibility)
      - FAA ASPM (Aviation System Performance Metrics) — airport arrival/departure rates, ground delay programs
      - Airport congestion metrics and runway configuration data

      **Airline-internal data:**
      - Aircraft maintenance logs (scheduled and unscheduled maintenance events)
      - Crew scheduling and duty-time records
      - Gate assignment systems and terminal capacity data
      - Passenger booking data (connection times, load factors)

      **Real-time feeds (for production):**
      - Live weather radar and TAF/METAR reports
      - FAA SWIM (System Wide Information Management) — real-time NAS status
      - Aircraft tracking (ADS-B) for incoming flight positions

      Now, let's think about how to frame this as an ML problem.
    dialogue:
      - speaker: interviewer
        text: "Let me walk you through the data available. We have 5 years of flight history — scheduled versus actual times for every flight, plus cancellation records."
      - speaker: candidate
        text: "Five years is great for capturing seasonal patterns. Do we have the reason codes for delays and cancellations? That would help us understand causality."
      - speaker: interviewer
        text: "Yes — reason codes cover weather, mechanical, crew issues, and ATC. We also have NOAA weather data, FAA airport performance metrics, aircraft maintenance logs, and crew schedules."
      - speaker: candidate
        text: "That's a rich feature space. The aircraft rotation data is particularly valuable — if a plane's previous leg is delayed, that cascades directly. And the real-time feeds will be critical for the 2-hour prediction horizon."
      - speaker: interviewer
        text: "Exactly. Now, given all this data and our scoped requirements, how would you frame this as an ML problem?"
    next: pd_formulation
    citations:
      - "https://www.faa.gov/data_research/aviation_data_statistics"
      - "https://www.ncdc.noaa.gov/data-access"

  - id: pd_formulation
    stage: problem_definition
    type: question
    label: "ML Problem Formulation"
    speaker: interviewer
    content: |
      How should we frame this as an ML problem? This is a fundamental design decision that will shape our entire system — the metrics we optimize, the features we engineer, and how users consume predictions.

      Consider: What output format is most useful for both passengers ("Should I leave for the airport now?") and operations ("Do we need to reassign gates?")?
    dialogue:
      - speaker: interviewer
        text: "Now for a crucial decision — how should we formulate this as an ML problem? Think about what output format is most useful for both passengers and operations teams."
      - speaker: candidate
        text: "There are two main approaches I'd consider. We could predict exact delay minutes as a regression problem, or classify into delay categories — on-time, minor delay, major delay."
      - speaker: interviewer
        text: "Walk me through the trade-offs. Which would you recommend and why?"
    choices:
      - label: "Regression: Predict delay in minutes"
        answer: |
          I'd frame this as a **regression problem** predicting delay duration in minutes.

          **Why regression?** Granularity is the key advantage. Telling a passenger "your flight will be approximately 40 minutes late" is far more actionable than "you have a minor delay." A 20-minute delay means "grab coffee," while a 90-minute delay means "find a restaurant" — both are "minor delays" in a categorical system but require completely different actions.

          **For operations**, precise minute estimates enable optimized resource allocation. If we predict a 45-minute delay, the gate can be temporarily reassigned. The operations team can calculate exactly when the inbound aircraft will be available for turnaround.

          **Modeling advantages:**
          - Preserves full information from training data — no discretization loss
          - Output naturally converts to categories post-hoc (e.g., `delay > 15 → delayed`)
          - Prediction intervals (quantile regression) give uncertainty bounds
          - Many powerful regression algorithms available: gradient boosting, neural nets, quantile forests

          **The challenge** is the target distribution — heavily right-skewed with most flights near zero and a long tail of extreme delays. We'll need to handle this carefully in training.
        next: met_reg_question
      - label: "Classification: Predict delay categories"
        answer: |
          I'd frame this as a **multi-class classification** problem with three categories: on-time (<15 min delay), minor delay (15–60 min), and major delay (60+ min).

          **Why classification?** These categories map directly to **actionable decisions**. "On-time" means no action needed. "Minor delay" triggers passenger notifications and standby gate preparation. "Major delay" triggers rebooking offers, meal vouchers, and full operational replanning. The business doesn't need to know if a delay is 37 vs 42 minutes — they need to know which action playbook to execute.

          **Probability calibration** is a major advantage. We can output "75% on-time, 20% minor delay, 5% major delay" — this confidence distribution is invaluable for risk-based decision making. Operations can set different action thresholds for different scenarios.

          **Handling the data distribution:** Flight delays follow a heavily imbalanced distribution (~70% on-time, ~20% minor, ~10% major). Classification with class weights or focal loss handles this more naturally than regression with skewed targets. We avoid the problem of optimizing for extreme tail values that regression faces.

          **Stakeholder communication** is simpler — "there's a 20% chance of a major delay" is easier for product teams and executives to reason about than "predicted delay: 12.7 ± 23.4 minutes."
        next: met_class_question

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: METRICS (6 nodes)
  # met_reg_question → (reg_rmse | reg_custom) ──► data_pipeline (CONVERGE)
  # met_class_question → (class_f1 | class_auc) ──► data_pipeline (CONVERGE)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: met_reg_question
    stage: metrics
    type: question
    label: "Regression Metrics"
    speaker: interviewer
    content: |
      Since we're doing regression, we need to choose the right evaluation metrics. The metric we optimize directly shapes model behavior — a poor metric choice means the model optimizes for the wrong thing, even if the architecture is perfect.

      What metrics would you use to evaluate prediction quality?
    dialogue:
      - speaker: interviewer
        text: "Good choice on regression. Now, what metrics would you use? Remember, the metric drives model behavior — choosing the wrong one means optimizing for the wrong thing."
      - speaker: candidate
        text: "That's a great point. I need to think about what kinds of errors matter most. A false sense of safety — predicting on-time when there's actually a 2-hour delay — is much worse than over-predicting slightly."
      - speaker: interviewer
        text: "Exactly. So how does that asymmetry factor into your metric choice?"
    choices:
      - label: "RMSE + MAE as primary/secondary metrics"
        answer: |
          I'd use **RMSE as primary** and **MAE as secondary**, with additional directional metrics.

          **Why RMSE?** It penalizes large errors quadratically, which aligns with business impact. Predicting a 2-hour delay as "on-time" is catastrophically worse than being off by 10 minutes on a short delay — the squared penalty captures this non-linear impact. In practice, `RMSE = √(mean((predicted - actual)²))`.

          **MAE as complement** provides an interpretable sanity check: "on average, we're off by X minutes." When MAE is much lower than RMSE, it signals outlier issues. For example, if MAE=12 min but RMSE=35 min, a few flights have very large prediction errors worth investigating.

          **Directional accuracy** is my third metric — what fraction of actual delays >15 min did we predict as delays? This "delay detection rate" is critical for the passenger notification use case. I'd target >85% detection of delays >30 min, even at the cost of some false positives.

          **Segmented evaluation**: I'd compute all metrics stratified by route, carrier, time of day, and season. A model with great overall RMSE could still fail badly on winter flights at ORD — segmented metrics catch this.
        next: data_pipeline
      - label: "Custom asymmetric loss aligned with business cost"
        answer: |
          I'd design a **custom asymmetric loss function** that reflects actual business costs of different error types.

          **The core insight:** not all errors are equal. Under-predicting delays (false negatives) cost far more than over-predicting (false positives).

          **Cost analysis:**
          - Under-prediction by 60+ min → missed connections ($500-2000 rebooking + hotel), passenger churn, brand damage
          - Under-prediction by 30 min → rushed gate changes, crew overtime ($200-500)
          - Over-prediction by 30 min → passengers arrive early (mild inconvenience), slight ops over-preparation ($50-100)

          **Custom loss:** `L = Σ w(actual, pred) × (actual - pred)²` where:
          - `w = 3.0` when `actual > pred` (under-prediction — worse)
          - `w = 1.0` when `actual ≤ pred` (over-prediction — acceptable)
          - Additional multiplier: `w *= 1 + 0.01 × actual` to weight long-delay errors higher

          **Evaluation metrics** still include RMSE and MAE for interpretability, but model optimization uses the asymmetric loss. I'd also track **cost-weighted error**: `Σ business_cost(actual, pred) / N` using the cost table above, giving a direct dollar-value metric that executives can reason about.

          This ensures the model optimizes for what the business actually cares about, not mathematical convenience.
        next: data_pipeline

  - id: met_class_question
    stage: metrics
    type: question
    label: "Classification Metrics"
    speaker: interviewer
    content: |
      Since we're doing classification, we need metrics that handle the class imbalance (~70% on-time, ~20% minor, ~10% major) and reflect the asymmetric costs of different misclassifications.

      What metrics framework would you propose?
    dialogue:
      - speaker: interviewer
        text: "For classification, the metric choice is particularly important given the class imbalance. About 70% of flights are on-time. What metrics would you propose?"
      - speaker: candidate
        text: "The imbalance is a key concern. Accuracy would be misleading — a model predicting 'on-time' always gets 70% accuracy. We need metrics that are sensitive to the minority classes, especially major delays."
      - speaker: interviewer
        text: "Right. And keep in mind that different types of misclassification have very different business costs."
    choices:
      - label: "Weighted F1 with per-class precision/recall"
        answer: |
          I'd use **weighted F1 score** as the primary metric, supported by per-class precision and recall breakdowns.

          **Why F1?** It balances precision and recall, both of which matter here. High precision means "when we predict a delay, it's usually real" — crucial for user trust. High recall means "we catch most actual delays" — crucial for the notification use case. F1's harmonic mean prevents gaming one at the other's expense.

          **Why weighted?** With 70/20/10 class distribution, macro F1 would over-weight the rare major delay class. Weighted F1 respects class frequencies while still considering all classes. I'd track both: weighted F1 for overall health, macro F1 to ensure we're not ignoring rare classes.

          **Per-class monitoring** is essential:
          - **On-time recall** >95% — don't annoy passengers with false delay alerts
          - **Major delay recall** >80% — we MUST catch these for rebooking
          - **Minor delay precision** >70% — avoid "cry wolf" effect

          **Confusion matrix heatmaps** weekly, segmented by route type (hub-hub, hub-spoke, point-to-point) to catch systematic biases. The most dangerous error pattern is major delays predicted as on-time — I'd set a separate alert if this exceeds 5%.
        next: data_pipeline
      - label: "ROC-AUC per class with probability calibration"
        answer: |
          I'd use **one-vs-rest ROC-AUC** for each class, combined with calibration metrics.

          **Why AUC?** It's threshold-independent, which is critical because different use cases need different operating points:
          - Passenger notifications: high precision threshold (avoid false alarms that erode trust)
          - Operations planning: low threshold (catch everything, over-preparation is cheap)
          - Rebooking offers: moderate threshold (cost of rebooking vs cost of missed connection)

          AUC evaluates across ALL thresholds simultaneously, so one metric captures performance for all downstream consumers.

          **Per-class AUC breakdown:**
          - On-time vs rest: target AUC > 0.90
          - Minor delay vs rest: target AUC > 0.85
          - Major delay vs rest: target AUC > 0.88 (critical to detect)

          **Probability calibration** is equally important. If the model says "70% on-time," roughly 70% of those flights should actually be on-time. I'd track calibration using **Expected Calibration Error (ECE)** and reliability diagrams. Well-calibrated probabilities enable principled downstream decision-making.

          **Log-loss (cross-entropy)** as a secondary metric — it directly measures probability quality and heavily penalizes confident wrong predictions. A model that says "99% on-time" for a flight that gets a major delay gets severely penalized, which is exactly what we want.
        next: data_pipeline

