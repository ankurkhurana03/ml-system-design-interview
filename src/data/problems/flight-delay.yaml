        text: "Let me summarize your overall design. You've covered all eight stages — from problem formulation through production monitoring."
      - speaker: candidate
        text: "I think the key strengths of this design are the temporal correctness of the feature pipeline, the multi-horizon prediction approach, and the strong monitoring with fast feedback loops."
      - speaker: interviewer
        text: "I agree. What would you say is the highest-risk aspect of this design?"
      - speaker: candidate
        text: "Honestly, the data pipeline. Integrating real-time feeds from multiple external sources — FAA, NOAA, ADS-B — creates many potential failure points. I'd invest heavily in data quality monitoring and graceful degradation when sources go down."
      - speaker: interviewer
        text: "That's a mature engineering perspective. The data pipeline is almost always the bottleneck in production ML systems. Any final thoughts before we wrap up?"
    next: mon_terminal

  - id: mon_terminal
    stage: monitoring
