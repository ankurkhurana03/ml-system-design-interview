  - id: data_pipeline
    stage: data
    type: info
    label: "Data Pipeline Architecture"
    speaker: interviewer
    content: |
      Good metric choices. Now let's design the data pipeline. Regardless of whether we chose regression or classification, the data infrastructure is largely shared.

      **Data sources to integrate:**

      | Source | Refresh Rate | Volume | Format |
      |--------|-------------|--------|--------|
      | Flight schedules | Daily | ~2K flights/day | Structured (SQL) |
      | Historical delays | Append-only | 5 years × 730K flights/year | Parquet |
      | Weather (NOAA) | Hourly | Per-airport observations | JSON API |
      | Weather forecasts (NWS) | 6-hourly | Grid-based forecasts | GRIB2/JSON |
      | FAA ASPM | 15-min | Airport metrics | XML/CSV |
      | Maintenance logs | Event-driven | ~50K events/year | Structured |
      | Crew schedules | Daily | ~8K crew/day | Structured |

      **Key data engineering decisions:**
      - **Feature computation window**: What lookback period for rolling statistics? (7-day, 30-day, seasonal)
      - **Join strategy**: Point-in-time joins to prevent data leakage — only use data available at prediction time
      - **Storage**: Feature store (Feast/Tecton) for online features, Parquet on S3 for offline training data
      - **Freshness**: Different features have different staleness tolerance. Weather forecasts must be <6h old; historical delay rates can be daily.

      Let's dig into data quality challenges.
    dialogue:
      - speaker: interviewer
        text: "Now let's talk about the data pipeline. We have multiple sources to integrate — flight schedules, weather, FAA metrics, maintenance, crew schedules. How would you architect this?"
      - speaker: candidate
        text: "I'd build a layered pipeline. A batch layer computes historical features daily — rolling delay rates, seasonal patterns, airport statistics. Then a streaming layer for real-time features like current weather and incoming aircraft status."
      - speaker: interviewer
        text: "Good. What about data leakage? That's a common pitfall in time-series prediction."
      - speaker: candidate
        text: "Critical point. Every feature must use point-in-time joins — we can only use data that was actually available at the moment we'd make the prediction. For the 24-hour horizon, that means weather forecasts, not observations. I'd implement strict temporal validation in the feature pipeline."
      - speaker: interviewer
        text: "Exactly right. Now, what data quality challenges do you anticipate?"
    next: data_quality_question
    citations:
      - "https://feast.dev/docs"

  - id: data_quality_question
    stage: data
    type: question
    label: "Data Quality Strategy"
    speaker: interviewer
    content: |
      Real-world airline data has significant quality issues. What's your biggest data quality concern, and how would you address it?

      Consider: the data isn't just noisy — it has systematic biases and structural problems that can silently corrupt your model.
    dialogue:
      - speaker: interviewer
        text: "Real-world airline data has significant quality issues — it's not just noisy, there are systematic biases. What's your biggest concern?"
      - speaker: candidate
        text: "I see two major challenges. Missing data is pervasive — weather stations go offline, maintenance logs are inconsistently recorded. And for classification, we have severe class imbalance."
      - speaker: interviewer
        text: "Good identification. Which would you prioritize tackling first?"
    choices:
      - label: "Missing data and sensor gaps"
        answer: |
          My primary concern is **missing and unreliable data**, which is pervasive across multiple sources.

          **Weather data gaps**: Weather stations have outages, especially during severe weather — ironically, exactly when predictions matter most. METAR reports can be delayed or missing for remote airports. Strategy: maintain multiple weather sources (NOAA, Weather Company, OpenMeteo) and implement automatic fallback. For missing observations, use spatial interpolation from nearby stations (kriging) rather than simple imputation.

          **Maintenance log inconsistency**: Different maintenance teams use different logging practices. Some record every inspection detail; others just log major events. Strategy: focus on structured fields (date, aircraft ID, maintenance type code) rather than free-text. Create binary features ("had unscheduled maintenance in last 7 days") that are robust to logging detail variation.

          **Crew scheduling gaps**: Crew data often updates late — reassignments happen last-minute. Strategy: compute features at multiple time snapshots and accept graceful degradation when crew data is stale.

          **General approach**: For each feature, track its **missingness rate** over time. If a feature's missingness exceeds 20%, it should be excluded or replaced. Use models that handle missing values natively (LightGBM, XGBoost) rather than imputation, which can introduce bias. Always include a **"data available" binary indicator** feature for each source — the model can learn when data absence itself is predictive.
        next: feat_question
      - label: "Class imbalance and label noise"
        answer: |
          My primary concern is **class imbalance and label noise**, which directly corrupt model training.

          **The imbalance problem**: ~70% on-time, ~20% minor delays, ~10% major delays. A naive model achieves 70% accuracy by always predicting "on-time." For regression, the equivalent issue is target skew — most targets cluster near zero with a long tail.

          **My strategy — multi-pronged:**
          1. **Stratified temporal splits**: Ensure train/val/test maintain class proportions within each time period. Don't just stratify globally — stratify within each month to preserve seasonal balance.
          2. **Class weights in loss function**: Weight inversely proportional to frequency. For regression, use sample weights based on delay magnitude.
          3. **Focused sampling**: Over-sample severe weather days and holiday periods where delays cluster. These are high-information training examples.
          4. **Threshold calibration**: Don't use default 0.5 — optimize thresholds on validation data separately for each use case.

          **Label noise** at class boundaries is equally dangerous. Is a 14-minute delay "on-time" but 16 minutes a "minor delay"? This 2-minute difference creates noisy labels near boundaries. Strategy: use **soft labels** during training (e.g., a 14-min delay gets label [0.7, 0.3, 0.0] instead of hard [1, 0, 0]). Alternatively, for regression, this boundary issue disappears entirely.

          **Label definition drift**: Airlines occasionally change how they report delays (e.g., redefining "gate arrival" vs "wheels down"). I'd monitor label distribution monthly and flag sudden shifts.
        next: feat_question

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4: FEATURES (4 nodes)
  # feat_question (CONVERGENCE) → (feat_temporal | feat_realtime | feat_weather) → mod_question (CONVERGE)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: feat_question
    stage: features
    type: question
    label: "Feature Engineering Strategy"
    speaker: interviewer
    content: |
      Now for feature engineering — arguably the most impactful part of the system. With dozens of data sources, we can't use everything. What's your primary feature engineering strategy?

      Think about which features provide the most predictive signal relative to their engineering and maintenance cost.
    dialogue:
      - speaker: interviewer
        text: "Feature engineering is where the real predictive power comes from. With all these data sources, what's your primary strategy? Think about signal-to-cost ratio."
      - speaker: candidate
        text: "I'd organize features into three tiers based on predictive value and engineering complexity. Let me walk through the options."
      - speaker: interviewer
        text: "Go ahead. I'm particularly interested in which features you think provide the most bang for the buck."
    choices:
      - label: "Temporal patterns and historical delay features"
        answer: |
          I'd prioritize **temporal and historical features** — they're the highest signal-to-cost ratio because they capture stable, recurring patterns.

          **Historical delay statistics** (strongest predictors):
          - Rolling delay rate for this flight number: 7-day, 30-day, seasonal averages
          - Route-level delay distribution: what percentage of LAX→JFK flights are delayed, by hour and day of week?
          - Carrier reliability scores: each airline has a characteristic delay profile
          - Airport delay rates by hour: ORD at 5pm vs 8am have very different delay distributions

          **Temporal features** (capture periodicity):
          - Hour of day, day of week, month — encoded as cyclical features (`sin/cos` encoding) to capture periodic patterns
          - Holiday indicators (Thanksgiving week vs normal Tuesday) and special event flags
          - Interaction features: "Friday 5pm at JFK" captures the compound effect of end-of-week + peak hour + busy airport
          - Season-weather interaction: "January at ORD" is very different from "January at PHX"

          **Network position features**:
          - Is this airport a hub for this carrier? (Hub flights have more backup options but also more congestion)
          - What percentage of passengers on this flight are connecting? (Higher connection rates mean delays cascade more)
          - Flight leg position in aircraft's daily schedule (first flight of the day is rarely delayed; last flight inherits all prior delays)

          These features are cheap to compute, stable over time, and provide strong baselines. In my experience, historical delay rates alone achieve ~75% of the final model's performance.
        next: mod_question
      - label: "Real-time operational status features"
        answer: |
          I'd prioritize **real-time operational features** — they capture current conditions that historical patterns miss, which is critical for the 2-hour prediction horizon.

          **Incoming aircraft status** (single strongest real-time predictor):
          - Current position and estimated arrival time of the inbound aircraft (via ADS-B tracking)
          - Delay status of the inbound aircraft's current flight — if it's 45 minutes late, ours will be too
          - Has the airline already swapped in a different aircraft? (Indicates they know about the issue)
          - Turnaround buffer: scheduled ground time minus minimum required turnaround

          **Airport operational state:**
          - Current departure queue length and average taxi time (from FAA ASPM, updated every 15 minutes)
          - Runway configuration and closures — reduced runways means reduced throughput
          - Active ground delay programs (GDP) or ground stops — these are explicit delay orders from ATC
          - Gate availability: if the arrival gate is occupied, the inbound aircraft has to wait

          **Crew and resource status:**
          - Are assigned crew members currently on delayed flights?
          - Crew duty-time remaining — if pilots are near the 8-hour limit, a swap might be needed (adds 30-60 min)
          - Maintenance status: any deferred maintenance items that need checks?

          **Network ripple effects:**
          - What percentage of this carrier's flights are delayed system-wide right now?
          - Any cascade events detected? (When >40% of flights at a hub are delayed, it typically takes 6+ hours to recover)

          For the 24-hour horizon, many of these aren't available yet, so I'd fall back to historical patterns. But for the 2-hour horizon, real-time features dominate prediction accuracy.
        next: mod_question
      - label: "Weather-centric features with derived indices"
        answer: |
          I'd prioritize **weather-derived features** — weather causes ~40% of all flight delays and is the most impactful external factor, yet most models use raw weather variables poorly.

          **The key insight:** raw weather values (temperature: 32°F, wind: 25 knots) aren't as predictive as **operational weather indices** that map weather to aviation impact.

          **Composite weather indices:**
          - **Crosswind component**: `wind_speed × sin(wind_direction - runway_heading)` — crosswind above 25 knots forces runway changes
          - **Ceiling/visibility category**: Map continuous values to FAA flight categories (VFR → MVFR → IFR → LIFR), each triggers specific ATC procedures
          - **Deicing probability**: `max(0, freezing_point - temperature) × precipitation_rate` — deicing adds 15-45 minutes per aircraft
          - **Thunderstorm impact score**: Combines convective SIGMET coverage, lightning density, and storm cell movement direction relative to approach paths

          **Weather at BOTH endpoints:**
          - Origin weather at departure time (affects taxi, deicing, departure queue)
          - Destination weather at arrival time (affects approach, holding patterns, diversions)
          - En-route weather (affects flight time, potential rerouting)

          **Forecast vs observation features:**
          - For 24h predictions: use NWS TAF (Terminal Aerodrome Forecast) — issued every 6 hours, covers 24h ahead
          - For 2h predictions: use METAR observations (current) + TAF short-term (2h ahead)
          - Include **forecast uncertainty** as a feature: NWS provides confidence intervals; high uncertainty itself predicts delays

          **Temporal weather patterns:**
          - Weather trend (improving vs deteriorating) — a clearing storm has different impact than an approaching one
          - Season × weather interaction: 2 inches of snow at DEN (routine) vs ATL (shutdown)

          Weather features require more engineering than historical stats, but they capture the causal mechanism behind delays, making the model more robust to distribution shift.
        next: mod_question
        citations:
          - "https://www.weather.gov/media/aviation/TAF_Card.pdf"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 5: MODEL (4 nodes)
  # mod_question (CONVERGENCE) → (mod_boosting | mod_neural | mod_ensemble) → train_strategy (CONVERGE)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: mod_question
    stage: model
    type: question
    label: "Model Architecture"
    speaker: interviewer
    content: |
      Now let's choose a model architecture. Given our feature set, what model would you use?

      Consider: this is tabular data with a mix of continuous, categorical, and temporal features. We need both accuracy and interpretability for operations teams. And we need to serve predictions at scale — 2,000 flights × multiple prediction horizons per day.
    dialogue:
      - speaker: interviewer
        text: "Time to choose a model architecture. We have tabular data with mixed feature types, need interpretability for operations, and must serve at scale. What would you recommend?"
      - speaker: candidate
        text: "For tabular data like this, there are three strong contenders — gradient boosting, neural networks with embeddings, or an ensemble approach. Each has different trade-offs."
      - speaker: interviewer
        text: "Walk me through your recommendation and why you'd choose it over the alternatives."
    choices:
      - label: "Gradient Boosting (LightGBM/XGBoost)"
        answer: |
          I'd use **LightGBM** as the primary model. For tabular prediction tasks with mixed feature types, gradient boosting consistently outperforms or matches deep learning while being dramatically simpler to deploy.

          **Why LightGBM specifically (vs XGBoost)?**
          - 5-10x faster training on large datasets (histogram-based splitting)
          - Native categorical feature support (no one-hot encoding needed for airport codes, carrier codes)
          - Better handling of high-cardinality features (thousands of route combinations)
          - Leaf-wise growth finds better splits than XGBoost's level-wise approach

          **Architecture for our problem:**
          - **Two-model setup**: Separate models for 24h and 2h prediction horizons (they use different feature sets and have different accuracy profiles)
          - **Quantile regression**: Train three models predicting 10th, 50th, and 90th percentile delays to get uncertainty bounds. Or use the `quantile` objective with `alpha=[0.1, 0.5, 0.9]`
          - **Feature interactions**: LightGBM naturally learns `weather × airport × time` interactions through its tree structure — no manual interaction engineering needed

          **Interpretability advantage:**
          - SHAP values explain individual predictions: "This flight is predicted 45 min late because: incoming aircraft delayed (+25 min), thunderstorm at destination (+15 min), historical route pattern (+5 min)"
          - Feature importance rankings show operations teams which factors drive delays system-wide
          - These explanations build trust and enable human override when needed

          **Practical benefits:** Trains in minutes on millions of rows. Handles missing values natively. No GPU required. Production-proven at Uber (ETA prediction), Booking.com, and multiple airlines.
        next: train_strategy
      - label: "Neural Network with embeddings"
        answer: |
          I'd design a **neural network with learned embeddings** for categorical features and a multi-task architecture.

          **Architecture design:**
          - **Embedding layers** for high-cardinality categoricals: airport codes (200 airports → 16-dim embedding), carrier codes (20 carriers → 8-dim), aircraft type (50 types → 8-dim), route pairs (5000+ routes → 32-dim). These embeddings learn semantic relationships — airports with similar weather patterns cluster together automatically.
          - **Continuous feature processing**: Batch normalization → dense layers for numerical features (weather values, delay statistics, congestion metrics)
          - **Concatenation + deep layers**: Merge embeddings and continuous features → 3 dense layers (256→128→64) with residual connections and dropout (0.3)
          - **Multi-task output heads**: One head for 24h prediction, one for 2h prediction. Shared representation layers learn common patterns; task-specific heads specialize.

          **Temporal modeling (optional but powerful):**
          - LSTM or Transformer layer processing the aircraft's daily flight sequence — learns how delays propagate through rotation schedules
          - Attention mechanism over historical flights for this route — weights recent similar conditions higher

          **Uncertainty quantification:**
          - Monte Carlo dropout at inference: run 10 forward passes, compute mean and std of predictions
          - Or mixture density network output: predict parameters of a delay distribution, not just point estimates

          **Trade-offs:**
          - Requires more data and tuning than boosting (but we have 3.6M flights over 5 years — plenty)
          - Needs GPU for training (but inference can be CPU or ONNX-optimized)
          - Less interpretable natively (use integrated gradients or attention weights for explanations)
          - Potentially better for capturing complex temporal dynamics and cross-feature interactions
        next: train_strategy
      - label: "Ensemble: Boosting + NN with learned stacking"
        answer: |
          I'd build a **two-layer ensemble** combining gradient boosting and a neural network, with learned stacking for optimal combination.

          **Layer 1 — Base models:**
          - **LightGBM**: Excels at tabular feature interactions, fast to train, handles missing values. Trained on all features including high-cardinality categoricals.
          - **Neural Network**: Embedding-based architecture for categoricals, multi-task for both prediction horizons. Better at capturing complex temporal sequences and cross-source patterns.
          - **Linear model** (optional third base): Elastic-net regularized regression as a calibration anchor. Simple but surprisingly competitive for well-engineered features.

          **Layer 2 — Meta-learner (stacking):**
          - Take base model predictions + key features as input to a final LightGBM model
          - Train on out-of-fold predictions from Layer 1 (5-fold temporal cross-validation to prevent leakage)
          - The meta-learner learns WHEN each base model is most reliable: "trust the NN more during weather events, trust LightGBM more for routine delays"

          **Why ensemble?**
          - Empirically, ensembles reduce error by 3-8% over best single model for tabular prediction tasks
          - Model diversity: tree-based and neural models make different types of errors, so combining them reduces variance
          - Robustness: if one model degrades (e.g., a feature source breaks), the ensemble degrades gracefully

          **Practical considerations:**
          - Increased serving complexity (2-3 models to maintain, but inference is still fast if base models are optimized)
          - More training infrastructure needed (can justify if prediction accuracy has clear $ value)
          - A/B testable: serve single model vs ensemble, measure if the accuracy gain translates to business value

          The ensemble approach is warranted here because delay prediction accuracy has direct revenue impact — even a 1% improvement in major delay detection saves millions in rebooking costs.
        next: train_strategy

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 6: TRAINING (5 nodes)
  # train_strategy (CONVERGENCE) → train_validation → train_approach_question → (train_offline | train_online) → deploy_question (CONVERGE)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: train_strategy
    stage: training
    type: info
    label: "Training Strategy"
    speaker: interviewer
    content: |
      Good model choice. Let's design the training strategy. For time-series prediction like flight delays, training methodology is critical — standard cross-validation will give you misleadingly optimistic results.

      **Temporal splitting is non-negotiable:**
      - Train: Jan 2020 – Dec 2023 (4 years, captures COVID disruption and recovery)
      - Validation: Jan – Mar 2024 (tune hyperparameters, select features)
      - Test: Apr – Jun 2024 (final evaluation, never touched during development)

      **Why not random splits?** Random splitting lets the model "cheat" — it could learn that Flight AA123 was delayed on June 15 using data from June 16. In production, we never have future data.

      **Seasonal considerations:**
      - Summer (June–Aug): thunderstorm season, ATC flow control programs
      - Winter (Dec–Feb): deicing, snow closures, polar vortex events
      - Holiday surges: Thanksgiving, Christmas, Spring Break — higher load, more cascading delays
      - We need at least 2-3 years to see these patterns repeat

      **COVID data handling:** 2020-2021 data has dramatically different patterns (reduced flights, different delay causes). Options: exclude it, down-weight it, or include with a "COVID era" binary feature. I'd include with the binary feature — the model learns to discount those patterns while keeping the data volume.

      Let's discuss validation approach and retraining strategy.
    dialogue:
      - speaker: interviewer
        text: "Training strategy is crucial for time-series problems. How would you split the data?"
      - speaker: candidate
        text: "Temporal splits only — never random. I'd train on 2020-2023, validate on Q1 2024, and hold out Q2 2024 for final testing. Random splits would introduce look-ahead bias."
      - speaker: interviewer
        text: "Good. What about the COVID period? 2020-2021 data looks very different."
      - speaker: candidate
        text: "I'd include it with a binary 'COVID era' feature rather than excluding. We keep the data volume, and the model learns to weight those patterns appropriately. Excluding two years would leave gaps in our seasonal coverage."
      - speaker: interviewer
        text: "Smart approach. Let's talk about validation methodology."
    next: train_validation

  - id: train_validation
    stage: training
    type: info
    label: "Validation & Hyperparameter Tuning"
    speaker: candidate
    content: |
      For validation and hyperparameter tuning, I'd use **expanding-window temporal cross-validation**:

      **Expanding window CV (5 folds):**
      - Fold 1: Train Jan 2020–Jun 2021, Val Jul–Sep 2021
      - Fold 2: Train Jan 2020–Dec 2021, Val Jan–Mar 2022
      - Fold 3: Train Jan 2020–Jun 2022, Val Jul–Sep 2022
      - Fold 4: Train Jan 2020–Dec 2022, Val Jan–Mar 2023
      - Fold 5: Train Jan 2020–Jun 2023, Val Jul–Sep 2023

      Each fold adds more training data (expanding window) and validates on the next unseen period. This mimics production: we always train on all available history and predict the future.

      **Hyperparameter search:**
      - Use Optuna with Bayesian optimization (more efficient than grid search)
      - Key hyperparameters for LightGBM: `num_leaves` (31-255), `learning_rate` (0.01-0.1), `feature_fraction` (0.6-0.9), `min_child_samples` (20-100), `reg_alpha` (0-10), `reg_lambda` (0-10)
      - 100-200 trials with early stopping on validation metric
      - Evaluate stability: if optimal hyperparameters vary wildly across CV folds, the search surface is noisy — use more regularization

      **Feature selection:**
      - Start with all features, compute SHAP-based importance
      - Remove features with near-zero importance (noisy, slow inference)
      - Remove highly correlated features (keep the one with higher importance)
      - Target: 50-100 features for production (manageable, fast inference)

      Now, what retraining strategy should we use?
    dialogue:
      - speaker: interviewer
        text: "Good validation framework. How would you tune hyperparameters?"
      - speaker: candidate
        text: "Optuna with Bayesian optimization across the temporal CV folds. I'd focus on regularization parameters — for LightGBM, that's num_leaves, learning rate, and L1/L2 regularization. About 100-200 trials with early stopping."
      - speaker: interviewer
        text: "And feature selection?"
      - speaker: candidate
        text: "SHAP-based importance analysis. Remove near-zero importance features and deduplicate correlated ones. I'd target 50-100 features for production — enough signal without excessive complexity."
      - speaker: interviewer
        text: "Good. Now, how do you keep the model fresh in production?"
    next: train_approach_question

  - id: train_approach_question
    stage: training
    type: question
    label: "Retraining Strategy"
    speaker: interviewer
    content: |
      How would you handle model retraining in production? Flight delay patterns shift over time — new routes, seasonal changes, airline mergers, and even gradual infrastructure improvements affect delay distributions.
    dialogue:
      - speaker: interviewer
        text: "Flight delay patterns shift over time. New routes, airline mergers, infrastructure changes. How would you keep the model current?"
      - speaker: candidate
        text: "This is really about how quickly we need to adapt versus the cost and risk of retraining. Let me consider the options."
      - speaker: interviewer
        text: "Right. And think about what could go wrong — a bad retrain could degrade predictions for thousands of flights."
    choices:
      - label: "Scheduled offline retraining (weekly)"
        answer: |
          I'd implement **weekly scheduled retraining** with automated quality gates.

          **Pipeline:**
          1. **Sunday midnight**: Trigger retraining pipeline via Airflow
          2. **Data refresh**: Pull latest week of flight data, recompute all features
          3. **Train**: Retrain on expanding window (all history up to last week)
          4. **Evaluate**: Run automated quality checks on holdout data:
             - Primary metric must be within 5% of current production model
             - No class has recall drop >10%
             - Calibration error <0.05
             - No single route has RMSE spike >3x
          5. **Stage**: If quality gates pass, deploy to shadow mode alongside production model
          6. **Promote**: After 24h shadow validation, promote to production (blue-green deployment)

          **Why weekly?**
          - Weekly captures route/schedule changes promptly
          - Weather pattern shifts propagate within 1-2 weeks
          - Keeps model fresh without excessive infrastructure cost
          - Gives enough new data for meaningful model updates (~14K new flights per week)

          **Safety mechanisms:**
          - Automatic rollback if production metrics degrade within 4h of promotion
          - Keep last 5 model versions deployable (instant rollback)
          - Human-in-the-loop approval for models that diverge significantly from prior version (feature importance shifts >20%)

          This approach is operationally manageable, catches drift within a week, and has strong safety rails against bad retrains.
        next: deploy_question
      - label: "Online learning with incremental updates"
        answer: |
          I'd implement **online learning with incremental model updates** for maximum freshness.

          **Architecture:**
          - Base model retrained weekly (for stability and seasonal patterns)
          - **Online adaptation layer** updated hourly with recent flight outcomes
          - The online layer learns short-term corrections: "delays are running 10 minutes longer than the base model predicts today at ORD" → adjust predictions accordingly

          **Implementation for LightGBM:**
          - Use `init_model` parameter to continue training from existing model (incremental boosting)
          - Add 10-20 new trees per update, each trained on last 24h of data
          - Cap total tree count (prune oldest trees when exceeding limit)
          - Alternatively: calibration layer (isotonic regression) updated hourly on recent predictions vs actuals

          **For neural networks:**
          - Fine-tune last 2 layers with small learning rate on recent data
          - Use exponential moving average of weights for stability
          - Implement gradient clipping to prevent catastrophic forgetting

          **Why online learning for this problem?**
          - Delay patterns change intra-day (morning clear, afternoon storms)
          - System-wide disruptions (ground stops, ATC issues) create temporary regime changes
          - Online adaptation captures these within hours, not days

          **Challenges:**
          - Requires low-latency feedback loop (actual departure times available ~30min after scheduled departure)
          - Risk of over-fitting to transient patterns (mitigate with regularization + base model anchor)
          - More complex infrastructure (streaming pipeline for label collection and model update)
          - Must handle concept drift detection to trigger full retrains when online adaptation is insufficient

          Worth the complexity if prediction freshness directly impacts business value (real-time operations decisions).
        next: deploy_question

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 7: DEPLOYMENT (3 nodes)
  # deploy_question (CONVERGENCE) → (deploy_batch | deploy_realtime) → mon_strategy (CONVERGE)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: deploy_question
    stage: deployment
    type: question
    label: "Deployment Architecture"
    speaker: interviewer
    content: |
      How would you deploy this model to serve predictions at scale? Remember, we need predictions for 2,000+ flights per day at two horizons (24h and 2h before departure).

      Think about the trade-offs between infrastructure simplicity, prediction freshness, and operational reliability.
    dialogue:
      - speaker: interviewer
        text: "Now for deployment. We need predictions for 2,000+ flights at two horizons. What architecture would you propose?"
      - speaker: candidate
        text: "The two main options are batch prediction — pre-compute everything on a schedule — versus real-time serving with an API. The right choice depends on how dynamic our predictions need to be."
      - speaker: interviewer
        text: "Good framing. Which would you recommend and what are the key trade-offs?"
    choices:
      - label: "Batch predictions with scheduled refresh"
        answer: |
          I'd use **batch prediction** with scheduled refresh at different cadences for each prediction horizon.

          **Architecture:**
          ```
          Airflow Scheduler
           ├─ Daily job (midnight): 24h predictions for tomorrow's flights
           │   └─ Predict all ~2,000 flights → write to PostgreSQL/DynamoDB
           ├─ Hourly job: 2h predictions for flights departing in next 3 hours
           │   └─ Re-predict ~250 flights/batch → update predictions table
           └─ Event-triggered: Re-predict specific flights on major input changes
               └─ Weather alert, aircraft swap, ground stop → targeted re-prediction
          ```

          **Storage:** Predictions table with columns: `flight_id, date, horizon, predicted_delay, confidence_interval, prediction_time, model_version, top_3_factors`. Apps query this table — no real-time model inference needed.

          **Why batch?**
          - **Operationally simpler**: No model serving infrastructure to maintain, no API latency concerns, no autoscaling complexity
          - **Allows larger models**: Can use ensemble or even expensive models since prediction isn't latency-sensitive
          - **Natural monitoring**: Each batch run produces a complete snapshot — easy to compare across runs
          - **Cost-effective**: ~2K predictions per run, even a slow model finishes in minutes

          **Event-triggered re-prediction** handles the freshness concern: when a significant input changes (severe weather warning, aircraft substitution, ground delay program), re-run prediction for affected flights immediately. This gives ~90% of real-time's benefit at ~20% of the infrastructure complexity.

          **Failure handling:** If a batch job fails, the previous predictions remain valid (stale but not absent). Alert on-call, retry within 30 minutes. Passengers see slightly stale predictions rather than no predictions.
        next: mon_strategy
      - label: "Real-time API with feature store"
        answer: |
          I'd deploy a **real-time prediction API** backed by a feature store for sub-second inference.

          **Architecture:**
          ```
          Client Apps (mobile/web/ops dashboard)
               │
               ▼
          API Gateway (rate limiting, auth)
               │
               ▼
          Prediction Service (K8s pods, auto-scaling)
           ├─ Feature Assembly: Feature Store (Feast/Tecton)
           │   ├─ Online store (Redis): real-time features, <10ms lookup
           │   └─ Offline store (S3/Parquet): historical features, materialized hourly
           ├─ Model Inference: ONNX-compiled LightGBM, <5ms inference
           └─ Response: prediction + confidence + explanation
          ```

          **API design:** `GET /v1/predict?flight=AA123&date=2024-07-15`
          Response: `{ delay_minutes: 35, confidence_interval: [15, 55], probability: { on_time: 0.25, minor: 0.55, major: 0.20 }, top_factors: [...], model_version: "v2.4.1" }`

          **Feature store** is the critical component:
          - **Online features** (Redis, <10ms): current weather, incoming aircraft status, airport queue length — updated every 5 minutes by streaming jobs
          - **Offline features** (precomputed, materialized hourly): historical delay rates, route statistics, seasonal patterns
          - Point-in-time correctness guaranteed by the feature store's timestamp-based lookups

          **Serving optimization:**
          - Compile LightGBM to ONNX for 10x faster inference
          - Cache predictions per flight with 5-minute TTL (handles multiple users checking same flight)
          - Auto-scale pods: 2-10 replicas based on request rate, target <70% CPU

          **Advantages:** Predictions are always fresh (use latest real-time features), can be personalized per request, and clients can request predictions at any time (not limited to batch schedule). This matters for the operations dashboard where controllers need instant re-prediction after they make changes.
        next: mon_strategy

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 8: MONITORING (6 nodes)
  # mon_strategy (CONVERGENCE) → mon_question → (mon_drift | mon_ab) → mon_scaling → mon_summary → mon_terminal
  # ═══════════════════════════════════════════════════════════════════════════

  - id: mon_strategy
    stage: monitoring
    type: info
    label: "Monitoring Strategy Overview"
    speaker: interviewer
    content: |
      Great deployment design. Now, a model in production is only as good as its monitoring. Flight delay prediction has some unique monitoring challenges:

      **Why monitoring is especially critical here:**
      - **Concept drift is guaranteed**: Weather patterns shift seasonally, airlines change routes quarterly, airport construction alters capacity annually. The world the model learned about is constantly changing.
      - **Feedback delay**: We know ground truth within hours (actual departure time), which is fast compared to many ML problems. We should exploit this for rapid evaluation.
      - **High-stakes errors**: A wrong prediction for 200 passengers has real consequences — missed connections, hours of frustration, and brand damage.
      - **Multiple failure modes**: The model can degrade (slow drift), fail suddenly (data pipeline break), or be correct but unused (if operations teams don't trust it).

      **Monitoring layers we need:**
      1. **Data quality**: Are inputs arriving? Are distributions normal?
      2. **Model performance**: Are predictions accurate? Any degradation?
      3. **System health**: Is serving fast? Are errors low?
      4. **Business impact**: Are predictions being used? Are outcomes improving?

      What monitoring approach would you prioritize?
    dialogue:
      - speaker: interviewer
        text: "A model in production is only as good as its monitoring. What makes monitoring especially critical for flight delay prediction?"
      - speaker: candidate
        text: "Several things. Concept drift is guaranteed — weather patterns, route changes, airline mergers. But we also have a major advantage: fast ground truth feedback. We know actual departure times within hours."
      - speaker: interviewer
        text: "Good point. That fast feedback loop is unusual in ML — most domains wait days or weeks for labels. How would you exploit it?"
      - speaker: candidate
        text: "We can compute accuracy metrics daily — sometimes hourly. That means we can detect model degradation within a day rather than waiting weeks. We should set up automated quality dashboards and alerts."
      - speaker: interviewer
        text: "Exactly. Let's discuss your monitoring approach in detail."
    next: mon_question

  - id: mon_question
    stage: monitoring
    type: question
    label: "Monitoring Focus"
    speaker: interviewer
    content: |
      What's your primary monitoring and evaluation strategy? We need to balance comprehensive monitoring with operational simplicity — monitoring itself shouldn't become more complex than the system it monitors.
    dialogue:
      - speaker: interviewer
        text: "What's your primary monitoring strategy? Remember, monitoring shouldn't be more complex than the system it monitors."
      - speaker: candidate
        text: "I see two main approaches. We can focus on technical monitoring — tracking prediction accuracy and data drift. Or we can focus on business impact monitoring — A/B testing and outcome measurement."
      - speaker: interviewer
        text: "Which would you prioritize, and why?"
    choices:
      - label: "Prediction accuracy and data drift monitoring"
        answer: |
          I'd build a **comprehensive technical monitoring stack** focused on prediction accuracy and data health.

          **Real-time accuracy dashboard (updated hourly):**
          - RMSE/MAE or F1/AUC (depending on formulation) computed on rolling 24h window
          - Segmented by: prediction horizon (24h vs 2h), carrier, airport, route type, time of day
          - Comparison line showing same period last year (captures seasonal expectations)
          - Alert: primary metric degrades >10% vs 7-day rolling average → page on-call ML engineer

          **Data drift detection (daily):**
          - For each input feature, compute PSI (Population Stability Index) comparing last 7 days vs training distribution
          - PSI > 0.1: yellow alert (investigate). PSI > 0.25: red alert (likely need retraining)
          - Special attention to weather features (seasonal shift) and network features (route changes)
          - Monitor feature missingness rates — if a data source goes partial, model degrades silently

          **Prediction distribution monitoring:**
          - Track daily distribution of predictions vs actuals (are we systematically over/under-predicting?)
          - Confusion matrix heatmap (classification) or residual plots (regression) updated daily
          - Alert on systematic bias: if mean residual deviates >5 min from zero for 3+ consecutive days

          **Calibration monitoring (weekly):**
          - Reliability diagrams: predicted probability vs observed frequency
          - ECE (Expected Calibration Error) — if it exceeds 0.05, trigger recalibration
          - Particularly important for the operations dashboard where probabilities drive resource allocation

          **Root cause analysis toolkit:**
          - When an alert fires, auto-generate a report: which segment degraded, which features drifted, when it started
          - This saves hours of investigation and accelerates remediation

          This gives us multi-layered visibility: we catch data issues (upstream), model issues (midstream), and serving issues (downstream) before they impact users significantly.
        next: mon_scaling
      - label: "A/B testing and business impact measurement"
        answer: |
          I'd prioritize **A/B testing and business impact monitoring** because ultimately, a technically accurate model that nobody uses provides zero value.

          **A/B test design:**
          - **Unit of randomization**: Route-day combinations (not individual flights — passengers compare notes)
          - **Treatment**: ML-powered predictions shown to passengers and operations teams
          - **Control**: Current system (no proactive predictions, status quo gate announcements)
          - **Duration**: 12 weeks minimum (captures multiple weather events, holiday period, and gathers statistical power)
          - **Stratification**: Balance by hub/non-hub, domestic/international, peak/off-peak to ensure fair comparison

          **Primary business metrics:**
          - **Passenger satisfaction (NPS)**: Survey passengers in treatment vs control groups
          - **Proactive action rate**: How often did predictions trigger early rebooking, gate changes, or crew adjustments?
          - **Operational cost savings**: Fewer last-minute hotel vouchers, less crew overtime, fewer missed connection rebookings
          - **Revenue impact**: Did passengers in the treatment group rebook to competitors less often?

          **Trust metrics (critical for adoption):**
          - **Engagement rate**: What percentage of passengers view delay predictions when available?
          - **Action rate**: Of those who view predictions, how many take actions (rebook, change plans)?
          - **Trust decay**: After a false alarm (predicted delay that didn't happen), does engagement drop? How long to recover?
          - **Operations adoption**: Are shift supervisors actually using the dashboard, or ignoring it?

          **Shadow mode before A/B:**
          - Run predictions for 4 weeks without showing anyone. Evaluate: how accurate would we have been?
          - This validates technical quality before risking customer-facing exposure
          - Also calibrates expectations — if shadow accuracy is 85%, we know A/B test results will include 15% "wrong" predictions

          **Continuous evaluation pipeline:**
          - Model performance metrics still tracked (accuracy, calibration, drift)
          - But business metrics are the **promotion criteria**: a model with 2% lower RMSE but no business impact improvement doesn't get deployed
          - Quarterly model reviews: is the ML system actually improving outcomes, or should we invest elsewhere?

          This approach ensures we're not just building an accurate model — we're building a system that creates measurable business value.
        next: mon_scaling

  - id: mon_scaling
    stage: monitoring
    type: info
    label: "Scaling and Edge Cases"
    speaker: candidate
    content: |
      Before we wrap up, let me address **scaling considerations and edge cases** that often trip up ML systems in production:

      **Handling extreme events:**
      - **Mass disruptions** (hurricanes, volcanic ash, system-wide ATC failures): The model hasn't seen enough examples to predict these well. Fallback strategy: when >30% of flights at an airport are cancelled, switch to rule-based predictions ("all flights likely delayed 2+ hours") rather than trusting the ML model.
      - **Novel situations**: New airports, new routes, new aircraft types that weren't in training data. Use graceful degradation: fall back to carrier-level or airport-level average delay predictions when route-specific features are missing.

      **Scaling to multi-airline or platform:**
      - Feature pipeline generalizes: weather, airport, ATC data are carrier-independent
      - Carrier-specific features (crew, maintenance, aircraft) need per-airline integration
      - Multi-tenant architecture: shared model infrastructure, per-airline model instances

      **Feedback loops to avoid:**
      - If our predictions cause passengers to arrive later (expecting a delay), the airline might hold the gate longer, creating a self-fulfilling prophecy
      - If operations acts on predictions (pre-positioning crews), the delay might be shorter — making our prediction look wrong (but we actually helped!)
      - Track **counterfactual impact**: what would have happened without our prediction?

      **Compliance and fairness:**
      - Ensure predictions don't systematically disadvantage specific routes or passenger groups
      - DOT requires accurate delay reporting — our predictions shouldn't influence official statistics
      - Data retention policies: how long do we keep prediction logs? (Usually 2 years for audit)
    dialogue:
      - speaker: interviewer
        text: "Good monitoring plan. Before we wrap up, what about extreme events and edge cases?"
      - speaker: candidate
        text: "Extreme events are where ML models typically fail. Hurricanes, volcanic ash, system-wide ATC failures — the model hasn't seen enough examples. I'd implement a fallback: when more than 30% of flights at an airport are cancelled, switch to rule-based predictions."
      - speaker: interviewer
        text: "What about feedback loops? Our predictions could actually change the outcomes we're predicting."
      - speaker: candidate
        text: "That's a subtle but important issue. If passengers arrive later expecting a delay, the airline might hold the gate, creating a self-fulfilling prophecy. Conversely, if operations acts on our predictions, the delay might be shorter — making our prediction look wrong even though we helped. We need to track counterfactual impact."
      - speaker: interviewer
        text: "Excellent awareness. Those feedback loops are often missed in system design interviews. Let's summarize your overall design."
    next: mon_summary

  - id: mon_summary
