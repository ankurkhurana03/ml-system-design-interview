  # ============ MONITORING ============
  - id: mon_question
    stage: monitoring
    type: question
    label: "Monitoring Strategy"
    speaker: interviewer
    content: |
      Translation quality monitoring is uniquely challenging because you can't compute ground-truth metrics in real-time (there's no reference translation for user inputs). How would you monitor quality in production?
    choices:
      - label: "Continuous human evaluation sampling"
        answer: |
          I'd implement **continuous human evaluation** as the primary quality monitoring signal:

          **Daily human evaluation pipeline:**
          1. **Random sampling**: 100 translations per language pair per day from production traffic (anonymized)
          2. **Professional evaluation**: Bilingual evaluators score each translation on:
             - **Adequacy** (1-5): Does the translation preserve the meaning?
             - **Fluency** (1-5): Does the translation read naturally?
             - **Error annotation**: Mark specific errors (mistranslation, omission, grammar)
          3. **MQM scoring**: Calculate error rate per 100 words per language pair

          **Evaluation infrastructure:**
          - **~50 bilingual evaluators** covering top 30 language pairs
          - **Crowdsourced evaluation** via platform like Appen/Toloka for remaining 70 languages
          - **Cost**: ~$200K/month for continuous evaluation across 100+ languages
          - **Turnaround**: 24-hour feedback loop -- today's production translations evaluated by tomorrow

          **Alert thresholds:**

          | Metric | Warning | Critical | Response |
          |--------|---------|----------|----------|
          | Average adequacy score | <4.0 | <3.5 | Investigate + retrain |
          | MQM errors per 100 words | >5 | >10 | Hotfix threshold |
          | Fluency score | <3.8 | <3.0 | Model rollback |
          | Any language drop >0.5 BLEU | Alert | >1.0 BLEU drop | Emergency investigation |

          **Complementary automated monitoring:**
          - **QE score distribution**: Track daily distribution of quality scores -- shift indicates model degradation
          - **User feedback signals**: Thumbs up/down, copy rate (users who copy translations found them useful), edit distance (for translation memory users)
          - **Regression test suite**: 10K curated test translations run daily, BLEU/COMET compared against baseline

          **Key insight**: Human evaluation is expensive but irreplaceable. Automated metrics can detect large regressions, but subtle quality issues (awkward phrasing, cultural insensitivity, domain misuse) require human judgment.
        next: mon_terminal_human
      - label: "Automated quality metrics with user feedback signals"
        answer: |
          I'd build an **automated monitoring system** combining model metrics with user behavior signals:

          **Automated quality tracking:**

          | Signal | Frequency | What It Detects |
          |--------|-----------|----------------|
          | **COMET-QE scores** (production) | Real-time | Per-translation quality estimate |
          | **Daily regression suite** | Daily | 10K test translations, BLEU + COMET vs. baseline |
          | **Embedding drift** (input) | Hourly | Source text distribution shift (new domains, events) |
          | **Token-level entropy** | Real-time | Model uncertainty increase |
          | **Output length ratio** | Real-time | Unusually short/long translations (hallucination indicator) |

          **User behavior signals (implicit quality feedback):**

          | Signal | What It Indicates | Reliability |
          |--------|------------------|-------------|
          | **Post-edit distance** | How much users correct translations | High (direct quality measure) |
          | **Copy rate** | Users trust and use the translation | Medium |
          | **Re-translation rate** | User tries same text again (dissatisfied) | High |
          | **Session duration** | Longer sessions with translation = useful | Low |
          | **Thumbs up/down** | Explicit feedback | Medium (biased sample) |
          | **Alternative selection** | User picks different suggested translation | High |

          **Anomaly detection system:**
          ```
          Per-language quality signal
               |
          Exponential moving average (window=7 days)
               |
          If signal deviates >2 standard deviations:
               |
          +----+----+
          |         |
          Quality   Quality
          drop      spike
          |         |
          Alert     Investigate
          + triage  (positive change
                    or data issue?)
          ```

          **User behavior correlation with quality:**
          - Track correlation between QE scores and user behavior signals
          - If QE says quality is high but re-translation rate increases, QE model may be miscalibrated
          - If users consistently edit translations in a specific domain, trigger domain-specific data collection

          **Advantages over human evaluation:**
          - **Real-time**: Detect issues in minutes, not 24 hours
          - **100% coverage**: Every translation is monitored, not just a sample
          - **Cost**: ~$30K/month (compute) vs. ~$200K/month (human evaluators)
          - **Scalable**: Adding new languages doesn't require hiring bilingual evaluators

          **Key trade-off**: Automated metrics miss subtle quality issues. Monthly human evaluation spot-checks are still needed as a calibration signal, but daily monitoring is automated.
        next: mon_terminal_auto

