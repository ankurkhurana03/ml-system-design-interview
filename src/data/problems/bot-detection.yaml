  - id: mon_prevalence
    stage: monitoring
    type: info
    label: "Prevalence Monitoring Details"
    speaker: interviewer
    content: |
      Excellent approach. Prevalence estimation is the most rigorous way to measure bot detection effectiveness.

      **Prevalence estimation methodology:**

      ```
      Weekly Random Sample (5,000 accounts)
           │
           ▼
      Analyst Review (2 reviewers per account)
           │
           ├── Definite bot (both agree)
           ├── Definite human (both agree)
           ├── Uncertain (disagree) → 3rd reviewer tiebreak
           │
           ▼
      Prevalence Estimate ± Confidence Interval
           │
           ├── Overall: X% ± Y% (95% CI)
           ├── By type: spam Z%, astroturfing W%, ...
           └── By detection status: caught A%, uncaught B%
      ```

      **Using prevalence to measure recall:**
      - Total estimated bots in sample: N_bot
      - Bots our system flagged: N_flagged
      - Recall estimate: N_flagged / N_bot
      - This gives unbiased recall even for bots the system missed

      **Red team scorecard (monthly):**

      | Bot Type Created | Accounts | Detected Within 24h | Within 7d | Undetected |
      |-----------------|----------|---------------------|-----------|-----------|
      | GPT content bot | 20 | 5 (25%) | 15 (75%) | 5 (25%) |
      | Follower farm | 100 | 80 (80%) | 95 (95%) | 5 (5%) |
      | Slow-burn astro | 10 | 0 (0%) | 3 (30%) | 7 (70%) |
      | Spam network | 50 | 45 (90%) | 50 (100%) | 0 (0%) |

      This scorecard directly drives model improvement priorities. In this example, slow-burn astroturfing bots need urgent attention.

      You've designed a comprehensive bot detection system!
    dialogue:
      - speaker: interviewer
        text: "What do you do when the red team consistently evades detection?"
      - speaker: candidate
        text: "That's actually the desired outcome of the exercise -- finding blind spots. We analyze exactly how the red team accounts differ from detected bots, create targeted training data from these accounts, and develop new features to capture the evasion patterns."
      - speaker: interviewer
        text: "How do you ensure the prevalence estimate is statistically valid?"
      - speaker: candidate
        text: "Sample size of 5,000 gives a margin of error of about +-1.4% at 95% confidence for a 5% prevalence rate. We stratify the sample by account age, activity level, and geography to ensure representativeness."
    next: mon_terminal_prevalence

  - id: mon_health
    stage: monitoring
    type: info
    label: "Platform Health Monitoring"
    speaker: interviewer
    content: |
      Great approach focusing on downstream impact.

      **Automated health alerting:**

      | Alert | Threshold | Action |
      |-------|----------|--------|
      | Spam encounter rate | >0.5% of impressions | Investigate + tighten thresholds |
      | Fake engagement spike | >5% on any trending topic | Flag topic for review |
      | Account creation rate | >5x normal sustained 1hr | Activate CAPTCHA for all new accounts |
      | Bot campaign detected | New coordinated cluster | Alert Trust & Safety team |
      | Model score drift | KL-divergence >0.05 | Investigate model health |

      **Integration with other platform systems:**
      - **Advertising**: Share bot scores with ad targeting -- don't serve ads to likely bots (saves advertiser money, builds trust)
      - **Recommendations**: Down-rank content from bot-amplified sources
      - **Search**: Exclude flagged accounts from people/account search
      - **Trending**: Filter bot engagement from trending algorithm inputs
      - **Verification**: Fast-track verification for accounts with very low bot scores

      **Regulatory compliance monitoring:**
      - EU DSA requires platforms to report bot prevalence
      - Maintain audit trail of all bot detection and enforcement actions
      - Quarterly transparency report with bot prevalence estimates, takedown numbers, and appeal statistics

      **Continuous improvement flywheel:**
      1. Detection system catches bots
      2. Human review confirms/corrects
      3. Confirmed labels feed back into training
      4. New model trained and deployed
      5. Red team tests new model
      6. Repeat

      You've designed a comprehensive bot detection system!
    dialogue:
      - speaker: interviewer
        text: "How do you handle the fact that bot detection can be politically controversial?"
      - speaker: candidate
        text: "Transparency is key. Publish methodology, error rates, and appeal statistics. Use consistent criteria regardless of political orientation. Have the Trust & Safety team review high-profile enforcement decisions before they take effect."
      - speaker: interviewer
        text: "What's the most impactful metric for stakeholders?"
      - speaker: candidate
        text: "For executives: fake engagement rate, because it directly impacts advertiser revenue and platform credibility. For users: spam encounter rate. For regulators: prevalence estimate with confidence intervals."
    next: mon_terminal_health

