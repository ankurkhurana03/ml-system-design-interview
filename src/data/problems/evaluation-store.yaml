      - speaker: interviewer
        text: "How do you drive organizational improvement?"
      - speaker: candidate
        text: "Quarterly evaluation reviews with leadership. Track model health trends, fairness improvements, and evaluation coverage. Make evaluation a first-class organizational priority."
