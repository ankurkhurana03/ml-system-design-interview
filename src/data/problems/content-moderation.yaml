      | Appeals | ~100K/month | <24h | Senior reviewers |
      | Escalations (model uncertain) | ~50K/day | <4h | Standard reviewers |
      | Policy edge cases | ~1K/week | 48h | Policy specialists |

      **Reviewer quality assurance:**
      - Each reviewer's accuracy tracked against consensus labels
      - Monthly calibration tests with known-answer items
      - Reviewers who fall below 85% agreement are re-trained
      - Cross-cultural review panels for content in non-English languages

      **Closing the feedback loop:**
      - Human review decisions feed directly into training data within 24 hours
      - Appeals that are overturned create high-value training examples (model errors)
      - Policy edge cases documented in a "policy encyclopedia" that informs both model training and reviewer training

      **Transparency reporting:**
      - Quarterly transparency report: Content removed by category, accuracy rates, appeal outcomes, geographic breakdown
      - Required by EU DSA (Digital Services Act) for platforms operating in Europe
      - Internal weekly report for ML and policy teams with detailed error analysis

      **Key insight:** Content moderation is never "solved" -- it's an ongoing process of policy evolution, model improvement, and human judgment. The monitoring system should reflect this by emphasizing continuous learning over static thresholds.

