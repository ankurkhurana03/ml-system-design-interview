    content: |
      Great automated monitoring approach. Let's detail the alerting and response system.

      **Tiered alerting:**

      | Tier | Response | Examples |
      |------|----------|---------|
      | **P0** | <5 min, auto-mitigation | Model service down, critical category scoring 0%, removal rate 10x normal |
      | **P1** | <30 min | Score distribution shift, per-language anomaly, latency SLA breach |
      | **P2** | <4 hours | Feature drift, retraining failure, labeler quality drop |
      | **P3** | Next day | Weekly fairness audit, model comparison report, cost analysis |

      **Auto-mitigation actions:**
      - If model service is down: Activate rule-based fallback (keyword + user risk scoring)
      - If removal rate spikes: Temporarily raise thresholds, route uncertain content to human review
      - If specific language model degrades: Route that language to human review, use English-translated model as backup

      **A/B testing for continuous improvement:**
      - Always run 1-2 challenger models alongside the champion
      - Compare on sampled human-labeled data (same traffic, different models)
      - Promotion requires: >2% F1 improvement AND no category regression AND policy team approval

      **Long-term health metrics (tracked monthly):**
      - User-reported content as % of total content (should decrease over time)
      - Time from harmful content post to removal (should decrease)
      - Repeat offender rate (should decrease with better detection)
      - Reviewer workload per content decision (should decrease as automation improves)
      - Cost per moderation decision (should decrease with efficiency)

      You've designed a comprehensive automated content moderation system!
