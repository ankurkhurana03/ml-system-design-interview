        text: "What's the most important metric to track for content moderation?"
      - speaker: candidate
        text: "User-reported content that the system auto-approved. If this rate increases, it means our model is missing harmful content that real users are catching. It's the most direct signal of false negatives at scale."
      - speaker: interviewer
        text: "How do you handle the fact that moderation policies change frequently?"
      - speaker: candidate
        text: "Policy versioning. Every model is tagged with the policy version it was trained on. When policy changes, we create new training data reflecting the change, retrain, and deploy with A/B testing. Old models remain active until the new model is validated."
